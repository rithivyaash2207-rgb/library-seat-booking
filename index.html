<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Library Seat Booking | Smart Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* PREMIUM MINIMALIST MONOCHROME THEME */
  :root {
    --bg: #F9FAFB;
    --surface: #FFFFFF;
    --surface-alt: #F3F4F6;
    --border: #E5E7EB;
    --border-strong: #D1D5DB;
    --text-primary: #111827;
    --text-secondary: #4B5563;
    --text-tertiary: #9CA3AF;
    
    --accent: #000000;
    --accent-hover: #374151;
    --accent-soft: #F3F4F6;
    
    /* Monochrome Seat States */
    --free: #FFFFFF;         --free-border: #D1D5DB;
    --occupied: #F3F4F6;     --occupied-border: #E5E7EB;
    --incoming: #FEE2E2;     --incoming-border: #DC2626;
    --yours: #DCFCE7;        --yours-border: #16A34A;
  }
  
  * { 
    box-sizing: border-box; 
    border-radius: 0 !important; /* Strict square corners */
  }
  
  body {
    margin: 0;
    background: var(--bg);
    font-family: 'Inter', -apple-system, sans-serif;
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  
  button, input { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .seat:focus-visible { outline-offset: 1px; }
  
  #app { 
    display: flex; 
    min-height: 100vh; 
    flex-direction: row; 
  }
  
  /* --- Welcome Screen --- */
  .welcome-screen { min-height: 100vh; width: 100%; display: grid; place-items: center; padding: 24px; background: var(--bg); }
  .welcome-card { width: min(100%, 420px); background: var(--surface); border: 1px solid var(--border); padding: 48px 40px; }
  .welcome-mark { width: 40px; height: 40px; display: grid; place-items: center; background: var(--accent); color: #fff; font-size: 20px; margin-bottom: 24px; }
  .welcome-eyebrow { color: var(--text-secondary); font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 8px; display: block; }
  .welcome-title { font-size: 28px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; margin: 0 0 12px; color: var(--text-primary); }
  .welcome-copy { color: var(--text-secondary); font-size: 14px; font-weight: 400; line-height: 1.6; margin: 0 0 32px; }
  .welcome-label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 8px; color: var(--text-primary); text-transform: uppercase; letter-spacing: 0.05em; }
  .welcome-input { width: 100%; padding: 12px 16px; border: 1px solid var(--border-strong); font-size: 14px; outline: none; transition: border-color 0.15s; margin-bottom: 20px; background: var(--surface); }
  .welcome-input:focus { border-color: var(--accent); }
  .welcome-submit { width: 100%; margin-top: 8px; padding: 14px; border: 1px solid var(--accent); background: var(--accent); color: white; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.15s; }
  .welcome-submit:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .welcome-footnote { color: var(--text-tertiary); font-size: 12px; line-height: 1.5; text-align: center; margin: 24px 0 0; }
  .welcome-error { color: #DC2626; background: #FEF2F2; padding: 12px; border: 1px solid #FCA5A5; font-size: 13px; margin-top: -8px; margin-bottom: 16px; font-weight: 500; }

  /* --- Navigation Rail --- */
  .rail { 
    background: var(--surface); 
    border-right: 1px solid var(--border); 
    width: 260px; 
    flex-shrink: 0; 
    padding: 32px 24px; 
    display: flex; 
    flex-direction: column; 
    gap: 8px; 
    position: sticky; 
    top: 0; 
    height: 100vh; 
    overflow-y: auto;
  }
  .rail-heading { color: var(--text-tertiary); font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; margin: 0 0 16px 0; }
  .rail-btn { padding: 16px; text-align: left; cursor: pointer; border: 1px solid transparent; background: transparent; transition: all 0.15s; }
  .rail-btn:hover:not(.active) { background: var(--surface-alt); border-color: var(--border); }
  .rail-btn.active { background: var(--surface-alt); border-color: var(--border-strong); }
  .rail-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .rail-label { font-size: 14px; font-weight: 600; color: var(--text-primary); }
  .rail-sub { font-size: 12px; font-weight: 400; color: var(--text-secondary); display: block; }
  .rail-free { font-size: 11px; font-family: 'JetBrains Mono', monospace; font-weight: 600; margin-top: 12px; display: inline-block; color: var(--text-secondary); }

  /* --- Main Content Area --- */
  .main { flex: 1; padding: 48px; overflow-y: auto; max-width: 1300px; margin: 0 auto; width: 100%; background: var(--bg); }
  
  .main-header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 40px; border-bottom: 1px solid var(--border); padding-bottom: 24px; gap: 16px; }
  .main-title { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 8px 0; color: var(--text-primary); }
  .main-sub { color: var(--text-secondary); font-size: 14px; font-weight: 500; margin: 0; }
  .main-count { background: var(--surface); border: 1px solid var(--border-strong); padding: 8px 16px; font-size: 13px; font-weight: 600; font-family: 'JetBrains Mono', monospace; display: flex; align-items: center; white-space: nowrap; color: var(--text-primary); }

  /* --- Dashboard / Ticket Layout --- */
  .dashboard { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(320px, 1fr); gap: 24px; margin: 0 0 40px; }
  .dash-card { background: var(--surface); border: 1px solid var(--border); padding: 24px; min-width: 0; }
  .ticket-card-head, .queue-card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 24px; }
  .ticket-card-head .dash-title, .queue-card-head .dash-title { margin: 0; font-size: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .queue-status-card { grid-column: 1 / -1; }
  
  .student-row { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; background: var(--surface-alt); padding: 16px; border: 1px solid var(--border); }
  .student-name-display { display: flex; flex: 1; min-width: 0; flex-direction: column; gap: 4px; }
  .student-name-label { color: var(--text-secondary); font-size: 11px; text-transform: uppercase; font-weight: 600; letter-spacing: 0.05em; }
  .student-name-display strong { font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
  
  .ticket-layout { display: flex; gap: 20px; align-items: center; background: var(--surface); padding: 24px; border: 1px solid var(--border); }
  .ticket-details { flex: 1; min-width: 0; }
  .ticket-code { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 18px; margin-bottom: 12px; color: var(--text-primary); display: inline-block; }
  .ticket-meta { color: var(--text-secondary); font-size: 13px; font-weight: 400; line-height: 1.6; overflow-wrap: anywhere; }
  .status-pill { display: inline-block; border: 1px solid var(--accent); background: var(--accent); color: #fff; padding: 4px 12px; font-size: 11px; font-weight: 600; text-transform: uppercase; margin-top: 12px; letter-spacing: 0.05em; }
  .status-pill.warning { background: transparent; color: var(--text-primary); border-color: var(--border-strong); }
  
  .ticket-actions { display: flex; gap: 8px; margin-top: 24px; flex-wrap: wrap; }
  
  /* --- Buttons --- */
  .btn, .small-btn, .btn-secondary { font-size: 13px; font-weight: 500; padding: 10px 16px; cursor: pointer; transition: all 0.15s; border: 1px solid var(--border); display: inline-flex; align-items: center; justify-content: center; background: var(--surface); color: var(--text-primary); }
  .small-btn { padding: 8px 12px; font-size: 12px; }
  .btn:hover, .small-btn:hover, .btn-secondary:hover { background: var(--surface-alt); border-color: var(--border-strong); }
  
  .small-btn.primary, .btn { background: var(--accent); color: white; border-color: var(--accent); }
  .small-btn.primary:hover, .btn:hover { background: var(--accent-hover); color: white; border-color: var(--accent-hover); }
  
  .btn { width: 100%; }
  .btn-secondary { width: 100%; background: transparent; color: var(--text-primary); }
  .btn-row { display: flex; gap: 12px; margin-top: 16px; }
  .btn-flex { flex: 1; }

  /* --- Zones & Maps --- */
  .zones { display: flex; flex-direction: column; gap: 24px; margin-bottom: 40px; }
  .zone { background: var(--surface); border: 1px solid var(--border); padding: 32px; }
  .zone-name { color: var(--text-primary); font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 24px; }

  .rows { display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; align-items: center; gap: 16px; }
  .row-label { color: var(--text-tertiary); font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 500; width: 24px; text-align: center; }
  .row-seats { display: flex; gap: 8px; flex-wrap: wrap; }

  .pods { display: flex; gap: 16px; flex-wrap: wrap; }
  .pod { border: 1px solid var(--border); background: var(--surface-alt); padding: 12px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }

  /* --- Seat Component --- */
  .seat {
    width: 32px; height: 32px; cursor: pointer; position: relative;
    border: 1px solid var(--border); flex-shrink: 0; padding: 0;
    transition: border-color 0.15s, background-color 0.15s;
  }
  .seat:hover { border-color: var(--text-primary) !important; }
  .seat.selected { border: 2px solid var(--accent) !important; z-index: 10; }
  .seat-plug-dot { position: absolute; top: 3px; right: 3px; width: 6px; height: 6px; background: var(--border-strong); }
  
  /* Keep seat markers readable against status colors */
  .seat[style*="background:var(--yours)"] .seat-plug-dot { background: #166534; }
  .seat[style*="background:var(--incoming)"] .seat-plug-dot { background: #991B1B; }

  /* --- Legend --- */
  .legend { background: var(--surface); border: 1px solid var(--border); padding: 20px 24px; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; }
  .legend-item { display: flex; align-items: center; gap: 10px; }
  .legend-swatch { width: 16px; height: 16px; border: 1px solid var(--border-strong); }
  .legend-label { color: var(--text-secondary); font-size: 13px; font-weight: 500; }
  .legend-dot { width: 8px; height: 8px; background: var(--border-strong); }

  /* --- Visual Map Adjustments --- */
  .floor-map {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 32px;
    display: grid;
    grid-template-columns: minmax(130px, 1.15fr) repeat(3, minmax(140px, 1fr)) 16px 70px;
    grid-template-rows: 120px 190px 190px 150px 60px;
    gap: 20px;
    position: relative;
    overflow: hidden;
  }
  .map-area {
    border: 1px solid var(--border);
    background: var(--surface-alt);
    padding: 16px;
    min-width: 0;
    min-height: 0;
  }
  .map-label {
    color: var(--text-secondary);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .1em;
    text-transform: uppercase;
    margin-bottom: 16px;
    text-align: center;
  }
  .map-table { position: relative; height: calc(100% - 32px); min-height: 80px; }
  .table-surface {
    position: absolute;
    border: 1px solid var(--border);
    background: var(--surface);
    left: 50%; top: 50%; transform: translate(-50%, -50%);
    z-index: 0;
  }
  .table4 .table-surface { width: 64px; height: 48px; }
  .table6 .table-surface { width: 88px; height: 56px; }
  .round4 .table-surface { width: 64px; height: 64px; border-radius: 50% !important; }
  .map-seat { position: absolute; z-index: 2; }
  
  .seat-top { left: 50%; top: 0; transform: translateX(-50%); }
  .seat-bottom { left: 50%; bottom: 0; transform: translateX(-50%); }
  .seat-left { left: 0; top: 50%; transform: translateY(-50%); }
  .seat-right { right: 0; top: 50%; transform: translateY(-50%); }
  
  .seat-top-left { left: 10%; top: 0; }
  .seat-top-right { right: 10%; top: 0; }
  .seat-bottom-left { left: 10%; bottom: 0; }
  .seat-bottom-right { right: 10%; bottom: 0; }
  
  .round4 .seat-top { top: 4px; }
  .round4 .seat-bottom { bottom: 4px; }
  .round4 .seat-left { left: 4px; }
  .round4 .seat-right { right: 4px; }

  .map-cabins-top { grid-column: 1 / 7; grid-row: 1; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); }
  .cabin-line { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 12px; flex: 1; align-items: center; padding: 0 12px; }
  .cabin { border: 1px solid var(--border); background: var(--surface-alt); display: flex; align-items: center; justify-content: center; padding: 8px; }

  .map-top-four { grid-column: 1; grid-row: 2; }
  .map-six-a { grid-column: 2; grid-row: 2; }
  .map-six-b { grid-column: 3; grid-row: 2; }
  .map-right-four-a { grid-column: 4; grid-row: 2; }
  .map-right-four-b { grid-column: 4; grid-row: 3; }
  .map-right-four-c { grid-column: 4; grid-row: 4; }
  .map-round-a { grid-column: 1; grid-row: 3; }
  .map-round-b { grid-column: 2; grid-row: 3; }
  .map-round-c { grid-column: 3; grid-row: 3; }
  .map-round-d { grid-column: 1; grid-row: 4; }
  .map-round-e { grid-column: 2; grid-row: 4; }
  .map-round-f { grid-column: 3; grid-row: 4; }

  .map-divider { grid-column: 5; grid-row: 2 / 5; display: flex; align-items: stretch; justify-content: center; }
  .divider-line { height: 100%; width: 1px; background: var(--border-strong); }
  
  .map-entrance {
    grid-column: 1 / 5; grid-row: 5;
    display: grid; place-items: center;
    border: 1px dashed var(--border-strong);
    background: var(--surface-alt); padding: 12px;
    color: var(--text-secondary); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em;
  }
  
  .map-side-cabins {
    grid-column: 6; grid-row: 2 / 5;
    display: flex; flex-direction: column; justify-content: space-around; gap: 16px;
  }
  .map-side-cabin {
    border: 1px solid var(--border); background: var(--surface-alt);
    flex: 1; display: flex; align-items: center; justify-content: center;
  }

  /* --- Queue List Styling --- */
  .queue-list { display: flex; flex-direction: column; gap: 12px; }
  .queue-item { display: flex; align-items: center; gap: 16px; border: 1px solid var(--border); padding: 16px; background: var(--surface); }
  .queue-number { display: grid; place-items: center; width: 36px; height: 36px; border: 1px solid var(--border); background: var(--surface-alt); color: var(--text-primary); font-weight: 600; font-size: 14px; }
  .queue-main { flex: 1; min-width: 0; }
  .queue-name { font-size: 14px; font-weight: 600; }
  .queue-sub { font-size: 12px; font-weight: 400; color: var(--text-secondary); margin-top: 4px; }
  .empty-ticket { border: 1px dashed var(--border-strong); padding: 32px; color: var(--text-secondary); font-size: 13px; font-weight: 400; line-height: 1.6; text-align: center; background: var(--surface-alt); }
  
  /* --- Notifications & Status --- */
  .notice { padding: 12px 16px; margin: 0 0 24px; font-size: 13px; font-weight: 500; background: var(--surface-alt); border: 1px solid var(--border-strong); color: var(--text-primary); }
  .notice.error { background: #FEF2F2; color: #991B1B; border-color: #FCA5A5; }
  .notice.success { background: #F0FDF4; color: #166534; border-color: #86EFAC; }

  /* --- Panel (Bottom Sheet / Modal) --- */
  .panel-backdrop {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(0, 0, 0, 0.4); border: none; padding: 0;
    backdrop-filter: blur(2px);
    animation: none; cursor: default;
  }
  @keyframes backdropIn { from { opacity: 0; } to { opacity: 1; } }
  
  .panel {
    position: fixed; left: 50%; bottom: 32px; z-index: 1001;
    transform: translateX(-50%);
    width: min(90vw, 420px); background: var(--surface); border: 1px solid var(--border);
    padding: 32px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    animation: none;
  }
  @keyframes sheetUp { from { transform: translate(-50%, 20px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
  
  .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
  .panel-title { display: flex; align-items: center; gap: 12px; }
  .panel-seat-code { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 600; color: var(--text-primary); }
  .panel-plug { display: flex; align-items: center; gap: 6px; color: var(--text-secondary); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; border: 1px solid var(--border-strong); padding: 4px 8px; }
  .panel-close { background: transparent; border: none; width: 32px; height: 32px; display: grid; place-items: center; cursor: pointer; color: var(--text-tertiary); font-size: 18px; transition: color 0.15s; }
  .panel-close:hover { color: var(--text-primary); }
  .panel-text { color: var(--text-secondary); font-size: 14px; line-height: 1.6; margin: 0 0 20px 0; }
  .panel-error { color: #DC2626; font-size: 13px; font-weight: 500; margin: 0 0 16px 0; }
  .panel-label { color: var(--text-secondary); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  
  .timer-row { display: flex; align-items: center; gap: 12px; background: var(--surface-alt); padding: 16px; margin-bottom: 20px; border: 1px solid var(--border); }
  .timer-value { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 600; color: var(--text-primary); }
  .timer-dot { color: var(--text-tertiary); font-size: 16px; }

  /* Queue Preview UI (in panel) */
  .queue-preview { display: flex; align-items: center; gap: 16px; margin: 20px 0; padding: 16px; border: 1px solid var(--border); background: var(--surface-alt); }
  .queue-preview-icon { display: grid; place-items: center; width: 36px; height: 36px; background: var(--surface); color: var(--text-secondary); font-size: 16px; border: 1px solid var(--border-strong); }
  .queue-preview-copy { flex: 1; }
  .queue-preview-title { color: var(--text-primary); font-size: 14px; font-weight: 600; }
  .queue-join-button { width: 100%; border: 1px solid var(--accent); padding: 12px; background: var(--accent); color: white; font-size: 13px; font-weight: 500; cursor: pointer; transition: background 0.15s; }
  .queue-join-button:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .queue-leave-button { width: 100%; border: 1px solid var(--border-strong); padding: 12px; background: transparent; color: var(--text-primary); font-size: 13px; font-weight: 500; cursor: pointer; transition: background 0.15s; }
  .queue-leave-button:hover { background: var(--surface-alt); }

  /* --- Scanner Modal --- */
  .scanner-backdrop { position: fixed; inset: 0; z-index: 2000; display: grid; place-items: center; padding: 24px; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(2px); }
  .scanner-modal { width: min(100%, 480px); background: var(--surface); border: 1px solid var(--border); padding: 32px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
  .scanner-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
  .scanner-title { font-size: 20px; font-weight: 600; margin: 0; color: var(--text-primary); }
  .scanner-copy { color: var(--text-secondary); font-size: 14px; line-height: 1.6; margin: 0 0 24px; }
  #qr-reader { width: 100%; overflow: hidden; border: 1px solid var(--border); }
  #qr-reader video { border-radius: 0; }
  .scanner-error { margin: 24px 0; color: #DC2626; font-size: 13px; font-weight: 500; background: #FEF2F2; padding: 12px; border: 1px solid #FCA5A5; }
  .scanner-actions { display: flex; gap: 12px; margin-top: 24px; }
  
  /* --- Media Queries --- */
  @media (max-width: 1200px) {
    .dashboard { grid-template-columns: 1fr; }
  }
  @media (max-width: 900px) {
    #app { flex-direction: column; }
    .rail { width: 100%; height: auto; position: relative; border-right: none; border-bottom: 1px solid var(--border); display: flex; flex-direction: row; overflow-x: auto; padding: 20px 24px; gap: 16px; }
    .rail-heading { display: none; }
    .rail-btn { min-width: 160px; flex-shrink: 0; border: 1px solid var(--border); }
    .main { padding: 32px 24px; }
    
    .floor-map {
      grid-template-columns: repeat(4, minmax(110px, 1fr));
      grid-template-rows: 110px 170px 170px 140px 56px;
      gap: 16px;
      overflow: visible;
    }
    .map-cabins-top { grid-column: 1 / 5; grid-row: 1; }
    .map-top-four { grid-column: 1; grid-row: 2; }
    .map-six-a { grid-column: 2; grid-row: 2; }
    .map-six-b { grid-column: 3; grid-row: 2; }
    .map-right-four-a { grid-column: 4; grid-row: 2; }
    .map-round-a { grid-column: 1; grid-row: 3; }
    .map-round-b { grid-column: 2; grid-row: 3; }
    .map-round-c { grid-column: 3; grid-row: 3; }
    .map-right-four-b { grid-column: 4; grid-row: 3; }
    .map-round-d { grid-column: 1; grid-row: 4; }
    .map-round-e { grid-column: 2; grid-row: 4; }
    .map-round-f { grid-column: 3; grid-row: 4; }
    .map-right-four-c { grid-column: 4; grid-row: 4; }
    .map-divider, .map-side-cabins { display: none; }
    .map-entrance { grid-column: 1 / 5; grid-row: 5; }
  }
  
  @media (max-width: 600px) {
    .main-header { flex-direction: column; gap: 16px; align-items: flex-start; padding-bottom: 16px; margin-bottom: 24px; }
    .main { padding: 20px 16px; }

<script>
/*
  SMART LIBRARY SEAT AVAILABILITY & OCCUPANCY MONITORING SYSTEM

*/

const SUPABASE_URL = "https://krpnszbyxitdqfsznugq.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_H-WORC6g4hhEfPw_-hKYzw_J26BmBod";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
let authUser = null;
let authMode = "signup";
let authBusy = false;
let authMessage = "";
let authMessageType = "";

function showAuthMessage(message, type="error") {
  authMessage = message;
  authMessageType = type;

}

async function loadSharedBookings() {
  if (!authUser) return;
  const { data, error } = await supabaseClient.rpc("get_active_seat_status");
  if (error) {
    setNotice("Could not refresh shared seat status: " + error.message, "error");
    return;
  }
  state.seats.forEach(seat => {
    seat.status = "free";
  });

  for (const row of (data || [])) {
    const seat = seatById(row.seat_id);
    if (!seat) continue;
    if (row.booking_status === "reserved") seat.status = "incoming";
    else if (row.booking_status === "checked_in") seat.status = "occupied";
  }
  
  const { data: mine, error: mineError } = await supabaseClient
    .from("bookings")
    .select("id,seat_id,status,reserved_at,check_in_deadline,session_expires_at")
    .eq("user_id", authUser.id)
    .in("status", ["reserved", "checked_in"])
    .order("reserved_at", { ascending: false })
    .limit(1);
    
  if (!mineError && mine && mine.length) {
    const b = mine[0];
    const seat = seatById(b.seat_id);
    if (seat) {
      seat.status = b.status === "checked_in" ? "yours" : "incoming";
      state.reservation = {
        bookingId: b.id,
        studentId: authUser.id,
        seatId: b.seat_id,
        floorId: seat.floorId,
        zoneId: seat.zoneId,
        status: b.status === "checked_in" ? "active" : "reserved",
        reservedAt: new Date(b.reserved_at).getTime(),
        checkInDeadline: b.check_in_deadline ? new Date(b.check_in_deadline).getTime() : null,
        expiresAt: b.session_expires_at ? new Date(b.session_expires_at).getTime() : null
      };
      if (b.status === "reserved" && b.check_in_deadline) showSeatAssignedBanner(b);
    }
  } else {
    state.reservation = null;
    dismissSeatAssignedBanner();
  }
  persistState();
}


let assignedSeatCountdownInterval = null;
let lastShownAssignedBookingId = null;
function dismissSeatAssignedBanner() {
  const el = document.getElementById("seatAssignedBanner");
  if (el) el.classList.remove("show");
}
function showSeatAssignedBanner(booking) {
  if (!booking || !booking.id || !booking.check_in_deadline) return;
  if (lastShownAssignedBookingId === String(booking.id)) return;
  lastShownAssignedBookingId = String(booking.id);
  const banner = document.getElementById("seatAssignedBanner");
  const message = document.getElementById("seatAssignedMessage");
  const scan = document.getElementById("seatAssignedScan");
  if (!banner || !message) return;
  const seat = seatById(booking.seat_id);
  message.textContent = `Seat ${seat ? seat.label : booking.seat_id} has been assigned to you automatically. Scan the entrance QR code within 15 minutes to confirm your arrival.`;
  if (scan) scan.href = "?checkin=entrance";
  banner.classList.add("show");
  if (assignedSeatCountdownInterval) window.clearInterval(assignedSeatCountdownInterval);
  const tick = () => {
    const deadline = new Date(booking.check_in_deadline).getTime();
    const remaining = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
    const counter = document.getElementById("seatAssignedCountdown");
    if (counter) counter.textContent = `${String(Math.floor(remaining/60)).padStart(2,"0")}:${String(remaining%60).padStart(2,"0")}`;
    if (remaining <= 0) {
      if (counter) counter.textContent = "00:00";
      window.clearInterval(assignedSeatCountdownInterval);
      showAppNotification("Your 15-minute check-in window has ended. The seat will be offered to the next student.", "error");
    }
  };
  tick();
  assignedSeatCountdownInterval = window.setInterval(tick, 1000);
}

let lastNotificationCheck = new Date().toISOString();
async function loadSharedWaitlist() {
  if (!authUser) return;
  const { data, error } = await supabaseClient
    .from("seat_waitlist")
    .select("id,seat_id,user_id,floor_id,zone_id,status,created_at,assigned_at")
    .eq("status", "waiting")
    .order("created_at", { ascending: true });
  if (error) {
    setNotice("Could not refresh the shared waiting list: " + error.message, "error");
    return;
  }
  state.waitingList = (data || []).map(row => ({
    id: row.id,
    requestedSeatId: row.seat_id,
    studentId: row.user_id,
    floorId: row.floor_id,
    zoneId: row.zone_id,
    createdAt: new Date(row.created_at).getTime(),
    assignedAt: row.assigned_at ? new Date(row.assigned_at).getTime() : null
  }));
  persistState();
}

async function pollSeatNotifications() {
  if (!authUser) return;
  const { data, error } = await supabaseClient
    .from("seat_notifications")
    .select("id,title,message,created_at")
    .eq("user_id", authUser.id)
    .is("read_at", null)
    .gt("created_at", lastNotificationCheck)
    .order("created_at", { ascending: true })
    .limit(20);
  if (error) return;
  if (data && data.length) {
    for (const n of data) {
      setNotice((n.title ? n.title + ": " : "") + n.message, "success");
      if ((n.title || "").toLowerCase().includes("seat assigned")) {
        const { data: assigned } = await supabaseClient.from("bookings")
          .select("id,seat_id,status,reserved_at,check_in_deadline,session_expires_at")
          .eq("user_id", authUser.id).eq("status", "reserved")
          .order("reserved_at", { ascending: false }).limit(1);
        if (assigned && assigned[0]) showSeatAssignedBanner(assigned[0]);
      }
    }
    const latest = data[data.length - 1].created_at;
    if (latest) lastNotificationCheck = latest;
    const ids = data.map(n => n.id);
    await supabaseClient.from("seat_notifications").update({ read_at: new Date().toISOString() }).in("id", ids);
  }
}

async function refreshAndRender() {
  await loadSharedBookings();
  await loadSharedWaitlist();
  if (state.selectedId) await loadQueueStats(seatById(state.selectedId));
  await pollSeatNotifications();
  render();
}

const STATUS_META = {
  free:     { label: "Free",                       varName: "free" },
  occupied: { label: "Occupied",                    varName: "occupied" },
  incoming: { label: "Incoming / Held",             varName: "incoming" },
  yours:    { label: "Yours",                       varName: "yours" },
};

const FLOORS = [
  { id: "f1", label: "Floor 1", name: "Ground Floor", sub: "Reading Hall",
    zones: [
      { id: "floorMap", name: "Ground Floor Seating", type: "map",
        items: [
          { id: "topCabins", kind: "cabin", count: 10, plugAll: true },
          { id: "topFour", kind: "table4", count: 1, plugSeats: [1] },
          { id: "sixA", kind: "table6", count: 1, plugSeats: [1] },
          { id: "sixB", kind: "table6", count: 1, plugSeats: [1] },
          { id: "rightFourA", kind: "table4", count: 1, plugSeats: [1,2] },
          { id: "rightFourB", kind: "table4", count: 1, plugSeats: [1,2] },
          { id: "rightFourC", kind: "table4", count: 1, plugSeats: [1,2] },
          { id: "roundA", kind: "round4", count: 1 },
          { id: "roundB", kind: "round4", count: 1 },

          { id: "roundD", kind: "round4", count: 1 },
          { id: "roundE", kind: "round4", count: 1 },
          { id: "roundF", kind: "round4", count: 1 },
          { id: "rightCabins", kind: "cabin", count: 4, plugAll: true }
        ]
      }
    ]},
  { id: "f2", label: "Floor 2", name: "First Floor", sub: "Silent Study",
    zones: [
      { id: "silentA", name: "Silent Zone A", type: "rows", rows: ["A","B","C"], cols: 7, plugEvery: 5 },
      { id: "silentB", name: "Silent Zone B", type: "rows", rows: ["D","E"], cols: 7, plugEvery: 6 },
    ]},
  { id: "f3", label: "Floor 3", name: "Second Floor", sub: "Group & Discussion",
    zones: [
      { id: "pods", name: "Group Pods", type: "pods", podCount: 6, plugEvery: 1 },
      { id: "open", name: "Open Floor", type: "rows", rows: ["A","B"], cols: 8, plugEvery: 3 },
    ]},
];

function buildSeats() {
  const seats = [];
  FLOORS.forEach(floor => {
    floor.zones.forEach(zone => {
      if (zone.type === "rows") {
        zone.rows.forEach(row => {
          for (let c = 1; c <= zone.cols; c++) {
            seats.push({ id: `${floor.id}-${zone.id}-${row}${c}`, floorId: floor.id, zoneId: zone.id, label: `${row}${c}`, plug: c % zone.plugEvery === 0, status: "free", timer: null });
          }
        });
      } else if (zone.type === "pods") {
        for (let p = 1; p <= zone.podCount; p++) {
          for (let s = 1; s <= 4; s++) {
            seats.push({ id: `${floor.id}-${zone.id}-P${p}-${s}`, floorId: floor.id, zoneId: zone.id, pod: p, label: `P${p}.${s}`, plug: s % zone.plugEvery === 0, status: "free", timer: null });
          }
        }
      } else if (zone.type === "map") {
        zone.items.forEach(item => {
          const seatCount = item.kind === "table4" || item.kind === "round4" ? 4 : item.kind === "table6" ? 6 : item.count;
          for (let i = 1; i <= seatCount; i++) {
            seats.push({
              id: `${floor.id}-${zone.id}-${item.id}-${i}`, floorId: floor.id, zoneId: zone.id, mapGroup: item.id,
              label: (() => {
                const prefix = { topCabins: "C", rightCabins: "C", topFour: "T1", sixA: "T2", sixB: "T3", rightFourA: "T4", rightFourB: "T5", rightFourC: "T6", roundA: "R1", roundB: "R2", roundC: "R3", roundD: "R4", roundE: "R5", roundF: "R6" }[item.id] || item.id;
                return item.kind === "cabin" ? `${prefix}${i}` : `${prefix}-${i}`;
              })(),
              plug: item.kind === "cabin" ? true : (item.plugSeats || []).includes(i), status: "free", timer: null
            });
          }
        });
      }
    });
  });
  return seats;
}

function formatReal(sec) {
  sec = Math.max(0, Math.round(sec));
  if (sec >= 3600) {
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
    return `${h}H ${String(m).padStart(2,"0")}M`;
  }
  const m = Math.floor(sec / 60), s = sec % 60;
  return `${m}:${String(s).padStart(2,"0")}`;
}

const STORAGE_KEY = "librarySeatBookingDemoV2";
const DEFAULT_STUDENT_ID = "STU-DEMO-01";
function readSavedState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"); }
  catch { return null; }
}
const saved = readSavedState();
const state = {
  seats: buildSeats(),
  activeFloor: "f1",
  selectedId: null,
  lockError: "",
  notice: "",
  noticeType: "",
  now: Date.now(),
  studentId: saved?.studentId || DEFAULT_STUDENT_ID,
  studentName: saved?.studentName || "",
  editingStudentName: false,
  welcomeError: "",
  reservation: saved?.reservation || null,
  waitingList: Array.isArray(saved?.waitingList) ? saved.waitingList : [],
  lastExpiredReservation: saved?.lastExpiredReservation || null,
  queueOffer: saved?.queueOffer || null,
  queuePanelOpen: false,
  queueStats: {},
  scannerOpen: false,
  scannerError: "",
  scannerFailed: false
};
if (saved?.seatStatuses && typeof saved.seatStatuses === "object") {
  state.seats.forEach(s => { if (saved.seatStatuses[s.id]) s.status = saved.seatStatuses[s.id]; });
}
function persistState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      studentId: state.studentId,
      studentName: state.studentName,
      reservation: state.reservation,
      waitingList: state.waitingList,
      lastExpiredReservation: state.lastExpiredReservation,
      queueOffer: state.queueOffer || null,
      seatStatuses: Object.fromEntries(state.seats.map(s => [s.id, s.status]))
    }));
  } catch {}
}
function seatById(id) { return state.seats.find(s => s.id === id); }
function freeCount(fid) { return state.seats.filter(s => s.floorId === fid && s.status === "free").length; }
function totalCount(fid) { return state.seats.filter(s => s.floorId === fid).length; }
function activeReservation() { return state.reservation && ["reserved", "active"].includes(state.reservation.status) ? state.reservation : null; }
function zoneQueue(seat) { return state.waitingList.filter(q => q.floorId === seat.floorId && q.zoneId === seat.zoneId).sort((a,b) => a.createdAt-b.createdAt); }
function makeBookingId() { return "LIB-" + Date.now().toString(36).toUpperCase().slice(-5) + "-" + Math.random().toString(36).slice(2,5).toUpperCase(); }
function setNotice(message, type="") { state.notice = message; state.noticeType = type; }
function clearSeatTimer(seat) { if (seat) seat.timer = null; }

function resolveTimers() {
  let changed = false;
  if (state.queueOffer && state.now >= state.queueOffer.expiresAt) {
    const expiredOffer = state.queueOffer;
    const offeredSeat = seatById(expiredOffer.seatId);
    state.queueOffer = null;
    if (offeredSeat) { offeredSeat.status = "free"; clearSeatTimer(offeredSeat); promoteNextWaiter(offeredSeat); }
    setNotice("Waiting-list offer expired (passed to next student).", "error"); persistState(); changed = true;
  }
  const r = state.reservation;
  if (r?.status === "reserved" && r.checkInDeadline && state.now >= r.checkInDeadline) {
    const seat = seatById(r.seatId);
    if (seat && seat.status === "incoming") seat.status = "free";
    clearSeatTimer(seat); if (seat) promoteNextWaiter(seat);
    state.lastExpiredReservation = { ...r, status: "expired", expiredAt: state.now };
    state.reservation = null;
    setNotice("Check-in window expired. Reserve again or join list.", "error"); persistState(); changed = true;
  }
  return changed;
}

function hasSeatAlready() { return !!activeReservation(); }
function openSeat(id) {
  if (state.selectedId === id && document.querySelector(".panel")) return;
  state.selectedId = id;
  state.lockError = hasSeatAlready() && activeReservation().seatId !== id ? "You have an active booking. Release it first." : "";
  render();
  loadQueueStats(seatById(id)).then(() => {
    if (state.selectedId === id) render();
  });
}

function queueStatsKey(seat) { return seat ? `${seat.floorId}|${seat.zoneId}` : ""; }
async function loadQueueStats(seat) {
  if (!authUser || !seat) return;
  const { data, error } = await supabaseClient.rpc("get_seat_waitlist_position", {
    p_seat_id: String(seat.id),
    p_floor_id: String(seat.floorId),
    p_zone_id: String(seat.zoneId)
  });
  if (error) {
    state.queueStats[queueStatsKey(seat)] = { error: error.message, waiting_count: null, my_position: null };
    return;
  }
  const result = Array.isArray(data) ? data[0] : data;
  state.queueStats[queueStatsKey(seat)] = result ? {
    ...result,
    my_position: result.your_position ?? result.my_position ?? null
  } : { waiting_count: 0, my_position: null, is_waiting: false };
}
function closePanel() { state.selectedId = null; state.lockError = ""; render(); }
function switchFloor(id) { state.activeFloor = id; closePanel(); }

async function lockFromLibrary(id) {
  const s = seatById(id);
  if (!s || !authUser) return;
  if (s.status !== "free") { setNotice("Seat unavailable.", "error"); render(); return; }
  if (hasSeatAlready()) { state.lockError = "You have an active booking. Release it first."; render(); return; }
  
  const { data, error } = await supabaseClient.rpc("reserve_seat", { p_seat_id: id });
  if (error) { setNotice(error.message, "error"); await refreshAndRender(); return; }
  
  await loadSharedBookings();
  state.selectedId = id;
  setNotice("Seat reserved. Scan QR within 15 mins.", "success");
  render();
}

async function checkIn(id, fromQr=false) {
  dismissSeatAssignedBanner();
  const s = seatById(id);
  if (!s) { setNotice("Invalid QR code.", "error"); render(); return; }
  if (!authUser) { setNotice("Sign in required.", "error"); render(); return; }
  
  const { error } = await supabaseClient.rpc("check_in_seat", { p_seat_id: id });
  if (error) { setNotice(error.message, "error"); await refreshAndRender(); return; }
  
  await loadSharedBookings();
  state.activeFloor = s.floorId;
  state.selectedId = id;
  setNotice("Check-in confirmed.", "success");
  render();
}

async function cancelHold(id) {
  const r = activeReservation();
  if (!r || r.seatId !== id || r.status !== "reserved") return;
  const { error } = await supabaseClient.rpc("release_seat", { p_seat_id: id });
  if (error) { setNotice(error.message, "error"); render(); return; }
  state.reservation = null;
  setNotice("Reservation cancelled.", "success");
  await supabaseClient.rpc("process_seat_waitlist", {
    p_seat_id: String(id), p_floor_id: String(seatById(id)?.floorId || ""), p_zone_id: String(seatById(id)?.zoneId || "")
  });
  await refreshAndRender();
}

async function exitForDay(id) {
  const r = activeReservation();
  if (!r || r.seatId !== id) return;
  const { error } = await supabaseClient.rpc("release_seat", { p_seat_id: id });
  if (error) { setNotice(error.message, "error"); render(); return; }
  state.reservation = null;
  state.selectedId = null;
  setNotice("Seat released. Assigning it to the next student in the shared queue if anyone is waiting.", "success");
  await supabaseClient.rpc("process_seat_waitlist", {
    p_seat_id: String(id), p_floor_id: String(seatById(id)?.floorId || ""), p_zone_id: String(seatById(id)?.zoneId || "")
  });
  await refreshAndRender();
}

async function joinWaitingList(id) {
  const s = seatById(id);
  if (!s || !authUser) return;
  if (hasSeatAlready()) { setNotice("Release your current booking first.", "error"); render(); return; }
  if (s.status === "free") { setNotice("This seat is available. Reserve it directly.", "error"); render(); return; }
  const { error } = await supabaseClient.rpc("join_seat_waitlist", {
    p_seat_id: String(s.id),
    p_floor_id: String(s.floorId),
    p_zone_id: String(s.zoneId)
  });
  if (error) {
    setNotice("Could not join the shared waiting list: " + error.message, "error");
    render();
    return;
  }
  setNotice("Joined the shared waiting list.", "success");
  await refreshAndRender();
  const q = state.queueStats[queueStatsKey(s)];
  if (q && q.my_position) setNotice(`You are #${q.my_position} in the waiting list. ${q.waiting_count} student(s) are waiting in this zone.`, "success");
  render();
}
async function leaveWaitingList() {
  if (!authUser) return;
  const { error } = await supabaseClient.rpc("leave_seat_waitlist");
  if (error) {
    setNotice("Could not leave the waiting list: " + error.message, "error");
    render();
    return;
  }
  setNotice("You left the waiting list.", "success");
  await refreshAndRender();
}
async function promoteNextWaiter(freedSeat) {
  if (!freedSeat || !authUser) return;
  const { error } = await supabaseClient.rpc("process_seat_waitlist", {
    p_seat_id: String(freedSeat.id),
    p_floor_id: String(freedSeat.floorId),
    p_zone_id: String(freedSeat.zoneId)
  });
  if (error) setNotice("Seat released, but automatic queue assignment needs attention: " + error.message, "error");
  await refreshAndRender();
}

async function updateStudentId(value) {
  const name = value.trim().replace(/\s+/g, " ");
  if (!name || name.length > 32 || !authUser) return;
  const { error } = await supabaseClient.auth.updateUser({ data: { full_name: name } });
  if (error) { setNotice(error.message, "error"); render(); return; }
  state.studentName = name; state.studentId = authUser.id; state.editingStudentName = false;
  persistState(); render();
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"}[ch]));
}

function handleQrCheckin() {
  const params = new URLSearchParams(window.location.search);
  const token = params.get("checkin");
  if (token !== "entrance" || !authUser) return;
  window.history.replaceState({}, document.title, window.location.pathname);
  const booking = activeReservation();
  if (!booking || booking.status !== "reserved") { setNotice("Sign in & reserve first.", "error"); render(); return; }
  checkIn(booking.seatId, true);
}

function legendHTML() {
  const items = Object.entries(STATUS_META).map(([key, m]) => `<div class="legend-item"><span class="legend-swatch" style="background:var(--${m.varName});border-color:var(--${m.varName}-border)"></span><span class="legend-label">${m.label}</span></div>`).join("");
  return `<div class="legend">${items}<div class="legend-item"><span class="legend-dot"></span><span class="legend-label">PLUG</span></div></div>`;
}

function railHTML() {
  const btns = FLOORS.map(f => {
    const active = f.id === state.activeFloor;
    return `<button class="rail-btn${active ? " active" : ""}" data-floor="${f.id}" aria-current="${active ? "true" : "false"}">
      <div class="rail-top"><span class="rail-label">${f.label}</span></div>
      <span class="rail-sub">${f.sub}</span>
      <div class="rail-free">${freeCount(f.id)} FREE</div>
    </button>`;
  }).join("");
  return `<div class="rail"><span class="rail-heading">Levels</span>${btns}</div>`;
}

function panelBodyHTML(seat) {
  const r = activeReservation(); const mine = r && r.seatId === seat.id;
  const queueInfo = state.queueStats[queueStatsKey(seat)] || {};
  const waitingCount = queueInfo.waiting_count === null || queueInfo.waiting_count === undefined ? null : Number(queueInfo.waiting_count);
  const myQueuePosition = Number(queueInfo.my_position) || -1;
  const queueCountText = waitingCount === null ? "Loading waiting list…" : `${waitingCount} STUDENT${waitingCount === 1 ? "" : "S"} WAITING`;
  const positionText = myQueuePosition > 0 ? `YOUR POSITION: #${myQueuePosition}` : "";
  if (seat.status === "occupied") {
    return `<p class="panel-text">Seat in use.</p><div class="queue-preview"><div class="queue-preview-icon">☷</div><div class="queue-preview-copy"><div class="queue-preview-title">${queueCountText}</div>${positionText ? `<div class="queue-preview-title" style="margin-top:8px">${positionText}</div>` : ""}</div></div>${myQueuePosition < 1 ? `<button class="queue-join-button" data-action="joinQueue">JOIN LIST</button>` : `<button class="queue-leave-button" data-action="leaveQueue">LEAVE LIST</button>`}`;
  }
  if (seat.status === "free") {
    const expiredMine = state.lastExpiredReservation && state.lastExpiredReservation.seatId === seat.id && state.lastExpiredReservation.studentId === state.studentId;
    if (state.lockError) return `<p class="panel-error">${state.lockError}</p><button class="btn-secondary" data-action="close">OK</button>`;
    return `<p class="panel-text">Available.</p>${expiredMine ? `<p class="notice">Booking ended. Reserve again.</p>` : ""}<button class="btn" data-action="lockLibrary">RESERVE</button>`;
  }
  if (seat.status === "incoming") {
    if (mine && r.status === "reserved") {
      const rem = Math.max(0, Math.ceil((r.checkInDeadline-state.now)/1000));
      return `<p class="panel-text">Scan QR to confirm.</p><div class="timer-row"><span class="timer-dot">■</span><span class="timer-value">${formatReal(rem)}</span><span class="panel-label">REMAINING</span></div><div class="btn-row"><button class="btn btn-flex" data-action="openScanner">SCAN QR</button><button class="btn-secondary" data-action="cancelHold">CANCEL</button></div>`;
    }
    if (state.queueOffer && state.queueOffer.seatId === seat.id && state.queueOffer.studentId === state.studentId) {
      return `<p class="panel-text">Offered to you.</p><button class="btn" data-action="acceptOffer">ACCEPT</button>`;
    }
    return `<p class="panel-text">Reserved.</p><div class="queue-preview"><div class="queue-preview-icon">☷</div><div class="queue-preview-copy"><div class="queue-preview-title">${queueCountText}</div>${positionText ? `<div class="queue-preview-title" style="margin-top:8px">${positionText}</div>` : ""}</div></div>${myQueuePosition < 1 ? `<button class="queue-join-button" data-action="joinQueue">JOIN LIST</button>` : `<button class="queue-leave-button" data-action="leaveQueue">LEAVE LIST</button>`}`;
  }
  if (seat.status === "yours" && mine && r.status === "active") {
    const rem = Math.max(0, Math.ceil((r.expiresAt-state.now)/1000));
    return `<p class="panel-text">Checked in.</p><div class="timer-row"><span class="timer-dot">■</span><span class="timer-value" id="panel-session-timer">${formatReal(rem)}</span><span class="panel-label">ACTIVE</span></div><div class="btn-row"><button class="btn-secondary" data-action="exitDay">RELEASE</button></div>`;
  }
  return `<p class="panel-text">Seat in use.</p>`;
}

function panelHTML() {
  if (!state.selectedId) return "";
  const seat = seatById(state.selectedId); if (!seat) return "";
  return `<button class="panel-backdrop" data-action="close" aria-label="Close"></button>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-seat-code">
    <div class="panel-head">
      <div class="panel-title">
        <span class="panel-seat-code" id="panel-seat-code">${seat.label}</span>

      </div>
      <button class="panel-close" data-action="close" aria-label="Close panel">X</button>
    </div>
    ${panelBodyHTML(seat)}

}

function ticketHTML() {
  const r = activeReservation();
  const queueEntries = state.waitingList.filter(q => q.studentId === state.studentId).sort((a,b)=>a.createdAt-b.createdAt);
  let ticket = `<div class="empty-ticket">NO ACTIVE BOOKING</div>`;
  
  if (r) {
    const seat = seatById(r.seatId);
    ticket = `<div class="ticket-layout"><div class="ticket-details"><div class="ticket-code">${r.bookingId}</div><div class="ticket-meta">SEAT: ${seat?.label || r.seatId} | FLOOR: ${FLOORS.find(f=>f.id===r.floorId)?.name || r.floorId}<br><span class="status-pill ${r.status==='active'?'success':'warning'}">${r.status==='active'?'CHECKED IN':'RESERVED'}</span></div></div></div><div class="ticket-actions"><button class="small-btn primary" data-action="openMySeat">VIEW</button><button class="small-btn" data-action="printTicket">PRINT</button><button class="small-btn" data-action="releaseTicket">CANCEL</button></div>`;
  }
  
  const queueHTML = queueEntries.length ? `<div class="queue-list">${queueEntries.map(q=>{const seat=seatById(q.requestedSeatId); const zone=FLOORS.find(f=>f.id===q.floorId)?.zones.find(z=>z.id===q.zoneId); const pos=zoneQueue({floorId:q.floorId,zoneId:q.zoneId}).findIndex(x=>x.studentId===q.studentId)+1; return `<div class="queue-item"><div class="queue-number">#${pos}</div><div class="queue-main"><div class="queue-name">${zone?.name || q.zoneId}</div><div class="queue-sub">${seat?.label || 'ANY'}</div></div><span class="status-pill ${pos===1?'success':''}">${pos===1?'NEXT':'WAIT'}</span></div>`}).join("")}</div><div class="ticket-actions"><button class="small-btn" data-action="leaveQueue">LEAVE</button></div>` : `<div class="empty-ticket">NO QUEUES</div>`;
  
  const queueCount = queueEntries.length;
  const queueToggle = `<button class="small-btn" data-action="toggleQueue" aria-expanded="${state.queuePanelOpen ? "true" : "false"}">${state.queuePanelOpen ? "HIDE QUEUE" : `QUEUE (${queueCount})`}</button>`;
  const queuePanel = state.queuePanelOpen ? `<section class="dash-card queue-status-card"><div class="queue-card-head"><h2 class="dash-title">QUEUE</h2><button class="panel-close" data-action="toggleQueue">X</button></div>${queueHTML}</section>` : "";
  
  return `<div class="dashboard">
    <section class="dash-card">
      <div class="ticket-card-head">
        <h2 class="dash-title">TICKET</h2>
        ${queueToggle}
      </div>
      <div class="student-row">
        ${state.editingStudentName 
          ? `<label for="student-id" class="student-name-label">NAME</label><input class="student-input welcome-input" id="student-id" style="margin:0; padding:8px 12px; font-size:14px; margin-right: 8px;" value="${escapeHTML(state.studentName)}" maxlength="32"><button class="small-btn primary" data-action="saveStudent">SAVE</button><button class="small-btn" data-action="cancelEditStudent">X</button>` 
          : `<span class="student-name-display"><span class="student-name-label">STUDENT</span><strong>${escapeHTML(state.studentName)}</strong></span>
             <button class="small-btn primary" data-action="openScanner">SCAN QR</button>
             <button class="small-btn" data-action="editStudent">EDIT</button>
             <button class="small-btn" data-action="signOut">SIGN OUT</button>`}
      </div>
      ${state.notice ? `<div class="notice ${escapeHTML(state.noticeType)}">${escapeHTML(state.notice)}</div>` : ""}
      ${ticket}
    </section>
    ${queuePanel}
  </div>`;
}

let seatQrScanner = null;
let qrCheckinInProgress = false;
function showScannerError(message) {
  state.scannerError = message;
  const modal = document.querySelector(".scanner-modal");
  if (!modal) return;
  let error = modal.querySelector(".scanner-error");
  if (!error) {
    error = document.createElement("p");
    error.className = "scanner-error";
    error.setAttribute("role", "alert");
    modal.querySelector(".scanner-actions")?.before(error);
  }
  error.textContent = message;
}
function scannerModalHTML() {
  if (!state.scannerOpen) return "";
  return `<div class="scanner-backdrop" role="presentation"><section class="scanner-modal" role="dialog" aria-modal="true" aria-labelledby="scanner-title"><div class="scanner-head"><h2 class="scanner-title" id="scanner-title">SCAN ENTRANCE QR</h2><button class="panel-close" data-action="closeScanner">X</button></div><p class="scanner-copy">Scan the code at the entrance to confirm.</p><div id="qr-reader"></div>${state.scannerError ? `<p class="scanner-error" role="alert">${escapeHTML(state.scannerError)}</p>` : ""}<div class="scanner-actions"><button class="btn-secondary" data-action="closeScanner">CANCEL</button>${state.scannerFailed ? `<button class="btn" data-action="retryScanner">RETRY</button>` : ""}</div></section></div>`;
}
function scannerModalMount() {
  if (!state.scannerOpen || seatQrScanner || state.scannerFailed || !document.getElementById("qr-reader")) return;
  if (!window.Html5Qrcode) { state.scannerError = "Scanner failed to load."; state.scannerFailed = true; render(); return; }
  
  seatQrScanner = new Html5Qrcode("qr-reader");
  seatQrScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 230, height: 230 }, aspectRatio: 1 }, async decodedText => {
    if (!state.scannerOpen || qrCheckinInProgress) return;
    let scannedValue = decodedText.trim();
    try { const parsed = new URL(decodedText, window.location.href); scannedValue = parsed.searchParams.get("checkin") || scannedValue; } catch {}
    if (scannedValue !== "entrance") { showScannerError("Invalid QR."); return; }
    
    const booking = activeReservation();
    if (!booking || booking.status !== "reserved") { showScannerError("Reserve a seat first."); return; }
    qrCheckinInProgress = true;
    await stopSeatScanner();
    state.scannerOpen = false; state.scannerError = ""; state.scannerFailed = false;
    try { await checkIn(booking.seatId, true); } finally { qrCheckinInProgress = false; }
  }, () => {}).catch(err => {
    seatQrScanner = null; state.scannerError = "Camera access required. " + (err?.message || ""); state.scannerFailed = true; render();
  });
}
async function stopSeatScanner() {
  if (!seatQrScanner) return;
  const scanner = seatQrScanner; seatQrScanner = null;
  try { await scanner.stop(); scanner.clear(); } catch {}
}
async function closeSeatScanner() {
  state.scannerOpen = false; state.scannerError = ""; state.scannerFailed = false;
  await stopSeatScanner(); render();
}
function openSeatScanner() {
  dismissSeatAssignedBanner();
  state.scannerOpen = true; state.scannerError = ""; state.scannerFailed = false;
  render(); scannerModalMount();
}

function render() {
  state.now = Date.now();
  if (!authUser) { document.getElementById("app").innerHTML = authScreenHTML(); return; }
  
  resolveTimers();
  const floor = FLOORS.find(f => f.id === state.activeFloor);
  const floorSeats = state.seats.filter(s => s.floorId === state.activeFloor);
  const zonesHTML = floor.zones.map(zone => zoneHTML(zone, floorSeats.filter(s => s.zoneId === zone.id))).join("");
  
  document.getElementById("app").innerHTML = `
    ${railHTML()}
    <div class="main">
      <div class="main-header">
        <div>
          <h1 class="main-title">${floor.name}</h1>
          <p class="main-sub">${floor.sub}</p>
        </div>
        <span class="main-count">
          <span style="display:inline-block; width:12px; height:12px; border: 1px solid var(--border-strong); background:var(--free); margin-right:8px;"></span>
          ${freeCount(state.activeFloor)} / ${totalCount(state.activeFloor)} FREE
        </span>
      </div>
      ${ticketHTML()}
      <div class="zones">${zonesHTML}</div>
      ${legendHTML()}
    </div>
    ${panelHTML()}
    ${scannerModalHTML()}`;
    
  if (state.scannerOpen) scannerModalMount();
  persistState();
}

// ---------- events ----------
document.addEventListener("submit", async (e) => {
  if (e.target.id !== "auth-form") return;
  e.preventDefault();
  if (authBusy) return;
  const name = (document.getElementById("auth-name")?.value || "").trim().replace(/\s+/g, " ");
  const email = (document.getElementById("auth-email")?.value || "").trim();
  const password = document.getElementById("auth-password")?.value || "";
  
  if (authMode === "signup" && (!name || name.length > 32)) { showAuthMessage("Enter name (max 32)."); return; }
  if (!email || password.length < 6) { showAuthMessage("Invalid email or password (<6 chars)."); return; }
  
  authBusy = true; authMessage = ""; render();
  
  let result = authMode === "signup" 
    ? await supabaseClient.auth.signUp({ email, password, options: { data: { full_name: name } } })
    : await supabaseClient.auth.signInWithPassword({ email, password });
    
  authBusy = false;
  if (result.error) { showAuthMessage(result.error.message); return; }
  if (authMode === "signup" && !result.data.session) { showAuthMessage("Account created. Please verify.", "success"); authMessageType = "success"; render(); return; }
  
  authUser = result.data.user;
  state.studentId = authUser.id;
  state.studentName = authUser.user_metadata?.full_name || email.split("@")[0];
  authMessage = "";
  await refreshAndRender();
});

document.addEventListener("click", async (e) => {
  if (e.target.closest("#auth-switch")) { authMode = authMode === "signup" ? "signin" : "signup"; authMessage = ""; render(); return; }
  
  const seatBtn = e.target.closest("[data-seat]"); if (seatBtn) { openSeat(seatBtn.dataset.seat); return; }
  const floorBtn = e.target.closest("[data-floor]"); if (floorBtn) { switchFloor(floorBtn.dataset.floor); return; }
  const actionEl = e.target.closest("[data-action]"); if (!actionEl) return;
  
  const action = actionEl.dataset.action; const id = state.selectedId;
  if (action === "signOut") { await supabaseClient.auth.signOut(); authUser = null; state.studentName = ""; state.studentId = ""; state.reservation = null; authMode = "signin"; authMessage = ""; render(); return; }
  if (action === "close") return closePanel();
  if (action === "lockLibrary") return lockFromLibrary(id);
  if (action === "confirmArrived") return checkIn(id, false);
  if (action === "openScanner") {
    const booking = activeReservation();
    if (!booking || booking.status !== "reserved") { setNotice("Reserve first.", "error"); render(); return; }
    return openSeatScanner();
  }
  if (action === "closeScanner") return closeSeatScanner();
  if (action === "retryScanner") { state.scannerFailed = false; state.scannerError = ""; render(); scannerModalMount(); return; }
  if (action === "cancelHold") return cancelHold(id);
  if (action === "exitDay") return exitForDay(id);
  if (action === "joinQueue") return joinWaitingList(id);
  if (action === "leaveQueue") return leaveWaitingList();
  if (action === "toggleQueue") { state.queuePanelOpen = !state.queuePanelOpen; render(); return; }
  
  if (action === "editStudent") { state.editingStudentName = true; render(); document.getElementById("student-id")?.focus(); return; }
  if (action === "cancelEditStudent") { state.editingStudentName = false; setNotice("Cancelled.", "success"); render(); return; }
  if (action === "saveStudent") {
    const input = document.getElementById("student-id");
    if (input) {
      const name = input.value.trim().replace(/\s+/g, " ");
      if (!name || name.length > 32) { input.setCustomValidity("Invalid."); input.reportValidity(); return; }
      updateStudentId(name);
    }
    return;
  }
  
  if (action === "openMySeat") { const r = activeReservation(); if (r) { state.activeFloor = r.floorId; openSeat(r.seatId); } return; }
  if (action === "releaseTicket") { const r = activeReservation(); if (r) return r.status === "reserved" ? cancelHold(r.seatId) : exitForDay(r.seatId); return; }
  if (action === "printTicket") { setNotice("Printing...", "success"); render(); window.print(); return; }
  if (action === "acceptOffer") {
    const offer = state.queueOffer; const s = offer && seatById(offer.seatId);
    if (!offer || !s || offer.studentId !== state.studentId || Date.now() > offer.expiresAt) { setNotice("Offer expired.", "error"); render(); return; }
    if (hasSeatAlready()) { setNotice("Release existing booking first.", "error"); render(); return; }
    state.reservation = { bookingId: makeBookingId(), studentId: state.studentId, seatId: s.id, floorId: s.floorId, zoneId: s.zoneId, status: "reserved", reservedAt: Date.now(), checkInDeadline: Date.now()+15*60*1000, expiresAt: null };
    s.status = "incoming"; s.timer = {startedAt:Date.now(),demoDurationMs:15*60*1000,realDurationSec:15*60,purpose:"checkin"}; state.queueOffer = null;
    setNotice("Offer accepted. Scan QR within 15 mins.", "success"); persistState(); render(); return;
  }
});

document.addEventListener("keydown", (e) => { if (e.key === "Escape" && state.selectedId) closePanel(); });

function updateVisibleTimerText() {
  if (!state.selectedId) return;
  const el = document.getElementById("panel-session-timer"); const r = activeReservation();
  if (el && r?.status === "active") el.textContent = formatReal(Math.max(0,(r.expiresAt-state.now)/1000));
  const panelTimer = document.querySelector(".panel .timer-value");
  if (panelTimer && r?.status === "reserved" && r.seatId === state.selectedId) panelTimer.textContent = formatReal(Math.max(0,(r.checkInDeadline-state.now)/1000));
}

setInterval(() => { state.now = Date.now(); if (resolveTimers()) render(); else updateVisibleTimerText(); }, 1000);
setInterval(async () => { if (authUser && !document.hidden) { await loadSharedBookings(); await loadSharedWaitlist(); await pollSeatNotifications(); if (state.selectedId) await loadQueueStats(seatById(state.selectedId)); render(); } }, 15000);

supabaseClient.auth.getSession().then(async ({ data, error }) => {
  if (error) { showAuthMessage(error.message); return; }
  authUser = data.session?.user || null;
  if (authUser) {
    state.studentId = authUser.id; state.studentName = authUser.user_metadata?.full_name || authUser.email?.split("@")[0] || "Student";
    await loadSharedBookings(); await loadSharedWaitlist(); render(); handleQrCheckin();
  } else { render(); }
});

supabaseClient.auth.onAuthStateChange(async (_event, session) => {
  authUser = session?.user || null;
  if (authUser) { state.studentId = authUser.id; state.studentName = authUser.user_metadata?.full_name || authUser.email?.split("@")[0] || "Student"; await loadSharedBookings(); await loadSharedWaitlist(); }
  render();
});

supabaseClient.channel("library-seat-bookings-live").on("postgres_changes", { event: "*", schema: "public", table: "bookings" }, async () => {
  if (authUser) await refreshAndRender();
}).subscribe();

render();
handleQrCheckin();
</script>
</body>
</html>
