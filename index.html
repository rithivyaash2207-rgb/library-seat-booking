<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Library Seat Booking | Smart Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F7F9;
    --surface: #FFFFFF;
    --surface-alt: #FAFBFC;
    --border: #E4E7EC;
    --border-strong: #D3D7DE;
    --text-primary: #171A21;
    --text-secondary: #67707D;
    --text-tertiary: #9AA1AC;
    --accent: #33415C;
    --accent-soft: #EEF1F6;
    --free: #FFFFFF;         --free-border: #D3D7DE;
    --occupied: #E3A263;     --occupied-border: #B97A3D;
    --incoming: #E8CC6B;     --incoming-border: #BFA13A;
    --yours: #6BAE85;        --yours-border: #3F8760;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    color: var(--text-primary);
  }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .seat:focus-visible { outline-offset: 1px; }
  #app { display: flex; min-height: 100vh; }
  .welcome-screen { min-height: 100vh; width: 100%; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top right, #e8edf6 0, transparent 38%), var(--bg); }
  .welcome-card { width: min(100%, 430px); background: var(--surface); border: 1px solid var(--border); border-radius: 22px; padding: 34px; box-shadow: 0 18px 55px rgba(23,26,33,.08); }
  .welcome-mark { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 14px; background: var(--accent); color: #fff; font-size: 22px; margin-bottom: 24px; }
  .welcome-eyebrow { color: var(--text-tertiary); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 9px; }
  .welcome-title { font-size: clamp(25px, 5vw, 32px); letter-spacing: -.04em; line-height: 1.15; margin: 0 0 10px; }
  .welcome-copy { color: var(--text-secondary); font-size: 14px; line-height: 1.6; margin: 0 0 26px; }
  .welcome-label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 8px; }
  .welcome-input { width: 100%; padding: 13px 14px; border: 1px solid var(--border-strong); border-radius: 10px; font: inherit; font-size: 14px; outline: none; }
  .welcome-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .welcome-submit { width: 100%; margin-top: 14px; padding: 13px 16px; border: 0; border-radius: 10px; background: var(--accent); color: white; font-size: 14px; font-weight: 600; cursor: pointer; }
  .welcome-submit:hover { opacity: .92; }
  .welcome-footnote { color: var(--text-tertiary); font-size: 11px; line-height: 1.5; text-align: center; margin: 18px 0 0; }
  .welcome-error { color: #B42318; font-size: 12px; margin-top: 8px; }
  .main { flex: 1; padding: 28px 32px; overflow: auto; }
  .main-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
  .main-title { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
  .main-count { color: var(--text-tertiary); font-size: 12.5px; font-family: 'JetBrains Mono', monospace; }
  .main-sub { color: var(--text-secondary); font-size: 13px; margin: 0 0 24px 0; }

  .zones { display: flex; flex-direction: column; gap: 20px; margin-bottom: 24px; }
  .zone { background: var(--surface-alt); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .zone-name { color: var(--text-secondary); font-size: 11.5px; font-weight: 600; letter-spacing: 0.02em; }

  .rows { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row-label { color: var(--text-tertiary); font-family: 'JetBrains Mono', monospace; font-size: 10.5px; width: 12px; }
  .row-seats { display: flex; gap: 6px; flex-wrap: wrap; }

  .pods { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
  .pod { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); padding: 8px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; }

  .seat {
    width: 24px; height: 24px; border-radius: 6px; cursor: pointer; position: relative;
    border-width: 1.5px; border-style: solid; flex-shrink: 0; padding: 0;
    transition: transform 120ms ease, box-shadow 120ms ease;
  }
  .seat:hover { transform: translateY(-1px); }
  .seat:active { transform: translateY(0); }
  .seat.selected { box-shadow: 0 0 0 2px var(--accent-soft); border-color: var(--accent) !important; }
  .seat-plug-dot { position: absolute; top: 2px; right: 2px; width: 4px; height: 4px; border-radius: 999px; background: var(--accent); }

  .legend { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px 20px; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-swatch { width: 10px; height: 10px; border-radius: 3px; border-width: 1px; border-style: solid; }
  .legend-label { color: var(--text-secondary); font-size: 12px; }
  .legend-dot { width: 6px; height: 6px; border-radius: 999px; background: var(--accent); }

  .rail { background: var(--surface); border-left: 1px solid var(--border); width: 132px; flex-shrink: 0; padding: 24px 12px; display: flex; flex-direction: column; gap: 8px; }
  .rail-heading { color: var(--text-tertiary); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; margin: 0 0 4px 4px; }
  .rail-btn { border-radius: 10px; padding: 10px 11px; text-align: left; cursor: pointer; border-width: 1px; border-style: solid; background: transparent; border-color: var(--border); transition: border-color 120ms ease, background 120ms ease; }
  .rail-btn:hover:not(.active) { border-color: var(--border-strong); background: var(--accent-soft); }
  .rail-btn.active { background: var(--accent); border-color: var(--accent); }
  .rail-top { display: flex; align-items: center; justify-content: space-between; }
  .rail-label { font-size: 13px; font-weight: 600; color: var(--text-primary); }
  .rail-btn.active .rail-label { color: #fff; }
  .rail-sub { font-size: 10.5px; color: var(--text-tertiary); display: block; }
  .rail-btn.active .rail-sub { color: #C7CEDB; }
  .rail-free { font-size: 10.5px; font-family: 'JetBrains Mono', monospace; color: var(--text-secondary); margin-top: 4px; }
  .rail-btn.active .rail-free { color: #fff; }

  .panel-backdrop {
    position: fixed; inset: 0; z-index: 1000;
    background: rgba(23,26,33,0.18); border: none; padding: 0;
    animation: backdropIn 160ms ease; cursor: default;
  }
  @keyframes backdropIn { from { opacity: 0; } to { opacity: 1; } }
  .panel {
    position: fixed; left: 50%; bottom: 20px; z-index: 1001;
    transform: translateX(-50%);
    width: min(92vw, 380px); background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px 18px 20px; box-shadow: 0 12px 32px rgba(23,26,33,0.16);
    animation: sheetUp 160ms ease;
  }
  @keyframes sheetUp { from { transform: translate(-50%, 12px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .panel, .panel-backdrop { animation: none; }
    .seat, .rail-btn { transition: none; }
  }
  .panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .panel-title { display: flex; align-items: center; gap: 8px; }
  .panel-seat-code { font-family: 'JetBrains Mono', monospace; font-size: 14.5px; font-weight: 600; }
  .panel-plug { display: flex; align-items: center; gap: 4px; color: var(--accent); font-size: 11px; }
  .panel-close { background: none; border: none; cursor: pointer; color: var(--text-tertiary); font-size: 16px; line-height: 1; }
  .panel-text { color: var(--text-secondary); font-size: 13px; margin: 0 0 10px 0; }
  .panel-label { color: var(--text-tertiary); font-size: 11px; }
  .panel-error { color: var(--text-primary); font-size: 12.5px; font-weight: 600; margin: 0 0 10px 0; }

  .choice-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .choice-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 6px; border-radius: 8px; font-size: 12.5px; border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary); cursor: pointer; }
  .choice-btn.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

  .km-input { width: 100%; background: var(--surface-alt); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; color: var(--text-primary); font-size: 13px; margin: 4px 0 10px 0; font-family: 'Inter', sans-serif; }

  .btn { border: none; border-radius: 8px; font-size: 13px; font-weight: 500; padding: 10px; cursor: pointer; color: #fff; width: 100%; }
  .btn-row { display: flex; gap: 8px; margin-top: 8px; }
  .btn-secondary { flex: 1; background: transparent; border: 1px solid var(--border); color: var(--text-secondary); border-radius: 8px; padding: 10px; font-size: 12.5px; cursor: pointer; }
  .btn-flex { flex: 1; }

  .timer-row { display: flex; align-items: center; gap: 8px; }
  .timer-value { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 600; color: var(--text-primary); }
  .timer-dot { color: var(--accent); font-size: 13px; }


  /* Ground-floor map: keep every seating zone in its own grid cell */
  .floor-map {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(115px, 1.15fr) repeat(3, minmax(120px, 1fr)) 10px 58px;
    grid-template-rows: 108px 170px 170px 132px 48px;
    gap: 12px;
    position: relative;
    overflow: hidden;
  }
  .map-area {
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    background: var(--surface-alt);
    padding: 10px;
    min-width: 0;
    min-height: 0;
  }
  .map-label {
    color: var(--text-secondary);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .045em;
    text-transform: uppercase;
    margin-bottom: 8px;
    line-height: 1.35;
  }
  .map-table {
    position: relative;
    height: calc(100% - 20px);
    min-height: 80px;
    overflow: visible;
  }
  .table-surface {
    position: absolute;
    border: 1px solid var(--border-strong);
    background: var(--surface);
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 0;
  }
  .table4 .table-surface { width: 52px; height: 38px; border-radius: 5px; }
  .table6 .table-surface { width: 70px; height: 42px; border-radius: 5px; }
  .round4 .table-surface { width: 48px; height: 48px; border-radius: 999px; }
  .map-seat { position: absolute; z-index: 2; }
  .map-seat .seat { width: 25px; height: 25px; }
  .seat-top { left: 50%; top: 0; transform: translateX(-50%); }
  .seat-bottom { left: 50%; bottom: 0; transform: translateX(-50%); }
  .seat-left { left: 0; top: 50%; transform: translateY(-50%); }
  .seat-right { right: 0; top: 50%; transform: translateY(-50%); }
  .seat-top-left { left: 12%; top: 0; }
  .seat-top-right { right: 12%; top: 0; }
  .seat-bottom-left { left: 12%; bottom: 0; }
  .seat-bottom-right { right: 12%; bottom: 0; }
  .round4 .seat-top { top: 2px; }
  .round4 .seat-bottom { bottom: 2px; }
  .round4 .seat-left { left: 5px; }
  .round4 .seat-right { right: 5px; }

  .map-cabins-top {
    grid-column: 1 / 7;
    grid-row: 1;
    display: flex;
    flex-direction: column;
  }
  .cabin-line {
    display: grid;
    grid-template-columns: repeat(10, minmax(0, 1fr));
    gap: 7px;
    flex: 1;
    min-height: 0;
  }
  .cabin {
    border: 1px solid var(--border-strong);
    overflow: hidden;
    border-radius: 7px;
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
  }
  .cabin .seat { width: 25px; height: 25px; }

  .map-top-four { grid-column: 1; grid-row: 2; }
  .map-six-a { grid-column: 2; grid-row: 2; }
  .map-six-b { grid-column: 3; grid-row: 2; }
  .map-right-four-a { grid-column: 4; grid-row: 2; }
  .map-right-four-b { grid-column: 4; grid-row: 3; }
  .map-right-four-c { grid-column: 4; grid-row: 4; }
  .map-round-a { grid-column: 1; grid-row: 3; }
  .map-round-b { grid-column: 2; grid-row: 3; }
  .map-round-c { grid-column: 3; grid-row: 3; }
  .map-round-d { grid-column: 1; grid-row: 4; }
  .map-round-e { grid-column: 2; grid-row: 4; }
  .map-round-f { grid-column: 3; grid-row: 4; }

  .map-divider {
    grid-column: 5;
    grid-row: 2 / 5;
    display: flex;
    align-items: stretch;
    justify-content: center;
    min-width: 0;
  }
  .divider-line {
    height: 100%;
    width: 8px;
    border-left: 1px solid var(--border-strong);
    border-right: 1px solid var(--border-strong);
    background: var(--accent-soft);
    border-radius: 3px;
  }
  .map-right-cabins { display: none; }
  .map-entrance {
    grid-column: 1 / 5;
    grid-row: 5;
    align-self: stretch;
    justify-self: stretch;
    display: grid;
    place-items: center;
    border: 1px dashed var(--border-strong);
    border-radius: 8px;
    background: var(--surface);
    padding: 8px 20px;
    color: var(--text-tertiary);
    font-size: 10px;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: .06em;
  }
  .map-side-cabins {
    grid-column: 6;
    grid-row: 2 / 5;
    position: static;
    width: auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    gap: 8px;
    padding: 0;
  }
  .map-side-cabin {
    border: 1px solid var(--border-strong);
    overflow: hidden;
    border-radius: 7px;
    background: var(--surface);
    flex: 1;
    min-height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .map-side-cabin .seat { width: 25px; height: 25px; }

  @media (max-width: 900px) {
    .floor-map {
      grid-template-columns: repeat(4, minmax(105px, 1fr));
      grid-template-rows: 100px 155px 155px 130px 46px;
      gap: 9px;
      padding: 12px;
      overflow: visible;
    }
    .map-cabins-top { grid-column: 1 / 5; grid-row: 1; }
    .map-top-four { grid-column: 1; grid-row: 2; }
    .map-six-a { grid-column: 2; grid-row: 2; }
    .map-six-b { grid-column: 3; grid-row: 2; }
    .map-right-four-a { grid-column: 4; grid-row: 2; }
    .map-round-a { grid-column: 1; grid-row: 3; }
    .map-round-b { grid-column: 2; grid-row: 3; }
    .map-round-c { grid-column: 3; grid-row: 3; }
    .map-right-four-b { grid-column: 4; grid-row: 3; }
    .map-round-d { grid-column: 1; grid-row: 4; }
    .map-round-e { grid-column: 2; grid-row: 4; }
    .map-round-f { grid-column: 3; grid-row: 4; }
    .map-right-four-c { grid-column: 4; grid-row: 4; }
    .map-divider, .map-side-cabins { display: none; }
    .map-entrance { grid-column: 1 / 5; grid-row: 5; }
    .cabin-line { gap: 4px; }
  }
  @media (max-width: 600px) {
    .floor-map {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: 100px repeat(6, 138px) 44px;
      gap: 8px;
      padding: 10px;
    }
    .map-cabins-top { grid-column: 1 / 3; grid-row: 1; }
    .cabin-line { gap: 3px; }
    .cabin .seat { width: 21px; height: 21px; }
    .map-top-four { grid-column: 1; grid-row: 2; }
    .map-six-a { grid-column: 2; grid-row: 2; }
    .map-six-b { grid-column: 1; grid-row: 3; }
    .map-right-four-a { grid-column: 2; grid-row: 3; }
    .map-round-a { grid-column: 1; grid-row: 4; }
    .map-round-b { grid-column: 2; grid-row: 4; }
    .map-round-c { grid-column: 1; grid-row: 5; }
    .map-right-four-b { grid-column: 2; grid-row: 5; }
    .map-round-d { grid-column: 1; grid-row: 6; }
    .map-round-e { grid-column: 2; grid-row: 6; }
    .map-round-f { grid-column: 1; grid-row: 7; }
    .map-right-four-c { grid-column: 2; grid-row: 7; }
    .map-divider, .map-side-cabins { display: none; }
    .map-entrance { grid-column: 1 / 3; grid-row: 8; }
  }

  .dashboard { display:grid; grid-template-columns:minmax(0,1fr) minmax(260px,340px); gap:14px; margin:0 0 22px; }
  .dash-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; min-width:0; }
  .ticket-card-head, .queue-card-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .ticket-card-head .dash-title, .queue-card-head .dash-title { margin:0; }
  .queue-status-card { grid-column:1 / -1; }
  .queue-card-head { margin-bottom:10px; }
  .queue-card-head .dash-copy { margin:5px 0 0; }
  .dash-title { font-size:13px; font-weight:700; margin:0 0 10px; }
  .dash-copy { color:var(--text-secondary); font-size:12px; line-height:1.55; margin:0; }
  .student-row { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .student-row label { color:var(--text-secondary); font-size:12px; white-space:nowrap; }
  .student-input { min-width:0; flex:1; width:100%; border:1px solid var(--border); border-radius:7px; padding:8px 9px; font:inherit; font-size:12px; }
  .student-name-display { display:flex; flex:1; min-width:0; flex-direction:column; gap:3px; }
  .student-name-label { color:var(--text-tertiary); font-size:10px; text-transform:uppercase; letter-spacing:.09em; font-weight:700; }
  .student-name-display strong { font-size:13px; font-weight:700; overflow-wrap:anywhere; }
  .ticket-layout { display:flex; gap:14px; align-items:center; }
  .ticket-details { flex:1; min-width:0; }
  .ticket-code { font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; margin-bottom:5px; }
  .ticket-meta { color:var(--text-secondary); font-size:12px; line-height:1.7; overflow-wrap:anywhere; }
  .qr-box { width:116px; min-width:116px; min-height:116px; border:1px solid var(--border); border-radius:8px; padding:5px; display:flex; align-items:center; justify-content:center; background:white; }
  .qr-box img, .qr-box canvas { max-width:100%; height:auto !important; }
  .ticket-actions { display:flex; gap:8px; margin-top:12px; }
  .small-btn { border:1px solid var(--border); border-radius:7px; padding:8px 10px; background:var(--surface); color:var(--text-primary); cursor:pointer; font-size:12px; }
  .small-btn.primary { background:var(--accent); color:white; border-color:var(--accent); }
  .queue-list { display:flex; flex-direction:column; gap:8px; margin-top:12px; }
  .queue-item { display:flex; align-items:center; gap:9px; border:1px solid var(--border); border-radius:8px; padding:9px; }
  .queue-number { display:grid; place-items:center; width:28px; height:28px; flex-shrink:0; border-radius:7px; background:var(--accent-soft); color:var(--accent); font-weight:700; font-size:12px; }
  .queue-main { flex:1; min-width:0; }
  .queue-name { font-size:12px; font-weight:600; }
  .queue-sub { font-size:11px; color:var(--text-secondary); margin-top:2px; }
  .status-pill { display:inline-block; border-radius:999px; background:var(--accent-soft); color:var(--accent); padding:4px 7px; font-size:10px; font-weight:700; }
  .status-pill.warning { background:#FFF4D9; color:#805D12; }
  .status-pill.success { background:#E6F5EB; color:#276B43; }
  .panel-qr { display:flex; align-items:center; gap:12px; margin:12px 0; padding:10px; border:1px solid var(--border); border-radius:9px; }
  .panel-qr .qr-box { width:84px; min-width:84px; min-height:84px; }
  .empty-ticket { border:1px dashed var(--border-strong); border-radius:9px; padding:15px; color:var(--text-secondary); font-size:12px; line-height:1.5; }
  .notice { border-radius:8px; padding:10px 12px; margin:0 0 12px; font-size:12px; line-height:1.5; background:var(--accent-soft); color:var(--accent); }
  .notice.error { background:#FFF0ED; color:#9B3528; }
  .notice.success { background:#E6F5EB; color:#276B43; }
  .main-count { white-space:nowrap; }
  @media(max-width:900px) { .dashboard { grid-template-columns:1fr; } }
  .scanner-backdrop { position:fixed; inset:0; z-index:2000; display:grid; place-items:center; padding:18px; background:rgba(17,24,39,.62); }
  .scanner-modal { width:min(100%,460px); max-height:92vh; overflow:auto; background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:20px; box-shadow:0 20px 70px rgba(0,0,0,.25); }
  .scanner-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px; }
  .scanner-title { font-size:18px; font-weight:700; margin:0; }
  .scanner-copy { color:var(--text-secondary); font-size:13px; line-height:1.55; margin:0 0 14px; }
  #qr-reader { width:100%; overflow:hidden; border-radius:12px; }
  #qr-reader video { border-radius:12px; }

<div id="app"></div>

<script>
/*
  SMART LIBRARY SEAT AVAILABILITY & OCCUPANCY MONITORING SYSTEM

  Master single-file prototype.

  Floors:
    - Ground Floor: custom seating map based on the supplied hand-drawn plan.
    - First Floor: silent-study seating.
    - Second Floor: group/discussion seating.

  Seat rules:
    - One student can lock only one seat at a time.
    - Clicking another seat while one is owned immediately shows an error.

// ---------- config ----------
const STATUS_META = {

  occupied: { label: "Occupied",                    varName: "occupied" },
  incoming: { label: "On the way / on break",       varName: "incoming" },
  yours:    { label: "Yours",                       varName: "yours" },

const FLOORS = [
  { id: "f1", label: "Floor 1", name: "Ground Floor", sub: "Reading Hall",
    zones: [
      { id: "floorMap", name: "Ground Floor Seating", type: "map",
        items: [
          { id: "topCabins", kind: "cabin", count: 10, plugAll: true },
          { id: "topFour", kind: "table4", count: 1, plugSeats: [1] },
          { id: "sixA", kind: "table6", count: 1, plugSeats: [1] },
          { id: "sixB", kind: "table6", count: 1, plugSeats: [1] },
          { id: "rightFourA", kind: "table4", count: 1, plugSeats: [1,2] },
          { id: "rightFourB", kind: "table4", count: 1, plugSeats: [1,2] },
          { id: "rightFourC", kind: "table4", count: 1, plugSeats: [1,2] },
          { id: "roundA", kind: "round4", count: 1 },
          { id: "roundB", kind: "round4", count: 1 },
          { id: "roundC", kind: "round4", count: 1 },
          { id: "roundD", kind: "round4", count: 1 },
          { id: "roundE", kind: "round4", count: 1 },
          { id: "roundF", kind: "round4", count: 1 },
          { id: "rightCabins", kind: "cabin", count: 4, plugAll: true }
        ]
      }
    ]},
  { id: "f2", label: "Floor 2", name: "First Floor", sub: "Silent Study",
    zones: [
      { id: "silentA", name: "Silent Zone A", type: "rows", rows: ["A","B","C"], cols: 7, plugEvery: 5 },
      { id: "silentB", name: "Silent Zone B", type: "rows", rows: ["D","E"], cols: 7, plugEvery: 6 },
    ]},
  { id: "f3", label: "Floor 3", name: "Second Floor", sub: "Group & Discussion",
    zones: [
      { id: "pods", name: "Group Pods", type: "pods", podCount: 6, plugEvery: 1 },
      { id: "open", name: "Open Floor", type: "rows", rows: ["A","B"], cols: 8, plugEvery: 3 },
    ]},
];

function buildSeats() {
  const seats = [];

  FLOORS.forEach(floor => {
    floor.zones.forEach(zone => {
      if (zone.type === "rows") {
        zone.rows.forEach(row => {
          for (let c = 1; c <= zone.cols; c++) {
            seats.push({
              id: `${floor.id}-${zone.id}-${row}${c}`,
              floorId: floor.id, zoneId: zone.id, label: `${row}${c}`,
              plug: c % zone.plugEvery === 0, status: "free", timer: null
            });
          }
        });
      } else if (zone.type === "pods") {
        for (let p = 1; p <= zone.podCount; p++) {
          for (let s = 1; s <= 4; s++) {
            seats.push({
              id: `${floor.id}-${zone.id}-P${p}-${s}`,
              floorId: floor.id, zoneId: zone.id, pod: p, label: `P${p}.${s}`,
              plug: s % zone.plugEvery === 0, status: "free", timer: null
            });
          }
        }
      } else if (zone.type === "map") {
        zone.items.forEach(item => {
          const seatCount = item.kind === "table4" || item.kind === "round4" ? 4
            : item.kind === "table6" ? 6
            : item.count;

          for (let i = 1; i <= seatCount; i++) {
            seats.push({
              id: `${floor.id}-${zone.id}-${item.id}-${i}`,
              floorId: floor.id, zoneId: zone.id, mapGroup: item.id,
              label: (() => {
                const prefix = {
                  topCabins: "C",
                  rightCabins: "C",
                  topFour: "T1",
                  sixA: "T2",
                  sixB: "T3",
                  rightFourA: "T4",
                  rightFourB: "T5",
                  rightFourC: "T6",
                  roundA: "R1",
                  roundB: "R2",
                  roundC: "R3",
                  roundD: "R4",
                  roundE: "R5",
                  roundF: "R6"
                }[item.id] || item.id;
                return item.kind === "cabin"
                  ? `${prefix}${i}`
                  : `${prefix}-${i}`;
              })(),
              plug: item.kind === "cabin" ? true : (item.plugSeats || []).includes(i),
              status: "free", timer: null
            });
          }
        });
      }
    });
  });

  // All seats start available in the fresh demo.

  return seats;
}

function formatReal(sec) {
  sec = Math.max(0, Math.round(sec));
  if (sec >= 3600) {
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
    return `${h}h ${String(m).padStart(2,"0")}m`;
  }
  const m = Math.floor(sec / 60), s = sec % 60;
  return `${m}:${String(s).padStart(2,"0")}`;
}
function remainingReal(timer, now) {
  if (!timer) return 0;
  const ratio = Math.min(1, (now - timer.startedAt) / timer.demoDurationMs);
  return timer.realDurationSec * (1 - ratio);
}

// ---------- state ----------
const STORAGE_KEY = "librarySeatBookingDemoV2";
const DEFAULT_STUDENT_ID = "STU-DEMO-01";
function readSavedState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"); }
  catch { return null; }
}
const saved = readSavedState();
const state = {
  seats: buildSeats(),
  activeFloor: "f1",
  selectedId: null,
  lockError: "",
  notice: "",
  noticeType: "",
  now: Date.now(),
  studentId: saved?.studentId || DEFAULT_STUDENT_ID,
  studentName: saved?.studentName || "",
  editingStudentName: false,
  welcomeError: "",
  reservation: saved?.reservation || null,
  waitingList: Array.isArray(saved?.waitingList) ? saved.waitingList : [],
  lastExpiredReservation: saved?.lastExpiredReservation || null,
  queueOffer: saved?.queueOffer || null,
  queuePanelOpen: false,
  scannerOpen: false,
  scannerError: "",
  scannerFailed: false
};
if (saved?.seatStatuses && typeof saved.seatStatuses === "object") {
  state.seats.forEach(s => { if (saved.seatStatuses[s.id]) s.status = saved.seatStatuses[s.id]; });
}
function persistState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      studentId: state.studentId,
      studentName: state.studentName,
      reservation: state.reservation,
      waitingList: state.waitingList,
      lastExpiredReservation: state.lastExpiredReservation,
      queueOffer: state.queueOffer || null,
      seatStatuses: Object.fromEntries(state.seats.map(s => [s.id, s.status]))

}
function seatById(id) { return state.seats.find(s => s.id === id); }
function freeCount(fid) { return state.seats.filter(s => s.floorId === fid && s.status === "free").length; }
function totalCount(fid) { return state.seats.filter(s => s.floorId === fid).length; }

  return state.reservation && ["reserved", "active"].includes(state.reservation.status) ? state.reservation : null;
}

  return state.reservation && state.reservation.seatId === id && ["reserved", "active"].includes(state.reservation.status);
}

  const floor = FLOORS.find(f => f.id === seat?.floorId);
  return floor?.zones.find(z => z.id === seat?.zoneId);
}

  return state.waitingList.filter(q => q.floorId === seat.floorId && q.zoneId === seat.zoneId).sort((a,b) => a.createdAt-b.createdAt);
}
function makeBookingId() {
  return "LIB-" + Date.now().toString(36).toUpperCase().slice(-5) + "-" + Math.random().toString(36).slice(2,5).toUpperCase();
}
function seatQrUrl(id) {
  const url = new URL(window.location.href);
  url.search = "";
  url.hash = "";
  url.searchParams.set("checkin", id);
  return url.toString();
}
function setNotice(message, type="") { state.notice = message; state.noticeType = type; }
function clearSeatTimer(seat) { if (seat) seat.timer = null; }
function resolveTimers() {
  let changed = false;
  if (state.queueOffer && state.now >= state.queueOffer.expiresAt) {
    const expiredOffer = state.queueOffer;
    const offeredSeat = seatById(expiredOffer.seatId);
    state.queueOffer = null;
    if (offeredSeat) {
      offeredSeat.status = "free";
      clearSeatTimer(offeredSeat);
      promoteNextWaiter(offeredSeat);
    }
    setNotice("A waiting-list offer expired and was passed to the next student.", "error");
    persistState();
    changed = true;
  }
  const r = state.reservation;
  if (r?.status === "reserved" && r.checkInDeadline && state.now >= r.checkInDeadline) {
    const seat = seatById(r.seatId);
    if (seat && seat.status === "incoming") seat.status = "free";
    clearSeatTimer(seat);
    if (seat) promoteNextWaiter(seat);
    state.lastExpiredReservation = { ...r, status: "expired", expiredAt: state.now };
    state.reservation = null;
    setNotice("Your check-in window expired. Reserve again or join the waiting list.", "error");
    persistState();
    changed = true;
  } else if (r?.status === "active" && r.expiresAt && state.now >= r.expiresAt) {
    const seat = seatById(r.seatId);
    if (seat) { seat.status = "free"; clearSeatTimer(seat); }
    state.lastExpiredReservation = { ...r, status: "expired", expiredAt: state.now };
    state.reservation = null;
    if (seat) promoteNextWaiter(seat);

}

  const s = seatById(id);

  if (hasSeatAlready()) { state.lockError = "You already have an active booking. Release it before booking another seat."; render(); return; }

  s.status = "incoming";

      if (zoneQueue(s).length) {
        promoteNextWaiter(s);
        setNotice("A student is waiting for this zone, so the seat cannot be renewed. Join the queue for the next available seat.", "error");
      } else {
        state.reservation = { ...expired, bookingId: makeBookingId(), status: "active", reservedAt: Date.now(), checkInDeadline: null, expiresAt: Date.now()+3*60*60*1000 };
        state.lastExpiredReservation = null;
        s.status = "yours"; s.timer = { startedAt: Date.now(), demoDurationMs: 3*60*60*1000, realDurationSec: 3*60*60, purpose: "session" };
        setNotice("Renewal confirmed. Your new 3-hour session has started.", "success");

  }

    r.status = "active"; r.checkedInAt = now; r.checkInDeadline = null; r.expiresAt = now + 3*60*60*1000;
    s.status = "yours"; s.timer = { startedAt: now, demoDurationMs: 3*60*60*1000, realDurationSec: 3*60*60, purpose: "session" };
    setNotice(fromQr ? "QR verified. Check-in successful — your 3-hour session has started." : "Check-in confirmed. Your 3-hour session has started.", "success");
  } else if (r.status === "active") {
    setNotice("You're already checked in. Your session ends at " + new Date(r.expiresAt).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}) + ".", "success");
  }

  if (s) promoteNextWaiter(s);
  setNotice("Reservation cancelled.", "success"); persistState(); render();
}

  const r = activeReservation();
  if (!r || r.seatId !== id) return;
  const s = seatById(id); if (s) { s.status = "free"; clearSeatTimer(s); }
  state.lastExpiredReservation = { ...r, status: "expired", expiredAt: Date.now() };
  state.reservation = null;

function leaveWaitingList() {
  state.waitingList = state.waitingList.filter(q => q.studentId !== state.studentId);
  setNotice("You've left the waiting list.", "success"); persistState(); render();
}
function promoteNextWaiter(freedSeat) {
  const queue = zoneQueue(freedSeat);
  if (!queue.length) return;
  const next = queue[0];
  state.waitingList = state.waitingList.filter(q => q !== next);
  // In this single-browser prototype, the offer is visible to the next demo student when they enter their ID.
  freedSeat.status = "incoming";
  freedSeat.timer = { startedAt: Date.now(), demoDurationMs: 5*60*1000, realDurationSec: 5*60, purpose: "offer" };
  state.queueOffer = { studentId: next.studentId, seatId: freedSeat.id, expiresAt: Date.now()+5*60*1000 };
  setNotice(`The seat was offered to ${next.studentId}, next on the waiting list.`, "success");
}
function updateStudentId(value) {
  const name = value.trim().replace(/\s+/g, " ");
  if (!name || name.length > 32) return;
  state.studentName = name;
  state.studentId = name.toUpperCase();
  persistState(); render();
}
function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"}[ch]));
}
function handleQrCheckin() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get("checkin");
  if (!id) return;
  window.history.replaceState({}, document.title, window.location.pathname);
  state.activeFloor = seatById(id)?.floorId || state.activeFloor;
  state.selectedId = id;
  checkIn(id, true);
}

// ---------- rendering ----------
function seatHTML(seat) {
  const m = STATUS_META[seat.status];
  const selected = seat.id === state.selectedId;
  const label = `Seat ${seat.label}${seat.plug ? ", near plug point" : ""} — ${m.label}`;
  return `<button class="seat${selected ? " selected" : ""}" data-seat="${seat.id}"
      style="background:var(--${m.varName});border-color:var(--${m.varName}-border)"
      title="${label}" aria-label="${label}" aria-pressed="${selected}">
      ${seat.plug ? '<span class="seat-plug-dot"></span>' : ""}
    </button>`;
}

function mapSeat(groupSeats, index, position) {
  const s = groupSeats[index];
  if (!s) return "";
  return `<span class="map-seat ${position}">${seatHTML(s)}</span>`;
}

function tableHTML(seats, kind) {

function panelBodyHTML(seat) {
  const r = activeReservation();
  const mine = r && r.seatId === seat.id;
  const queue = zoneQueue(seat);
  const myQueuePosition = queue.findIndex(q => q.studentId === state.studentId);
  if (seat.status === "occupied") {
    const freeInZone = state.seats.filter(x => x.floorId === seat.floorId && x.zoneId === seat.zoneId && x.status === "free").length;
    return `<p class="panel-text">Occupied by another student right now.</p>${freeInZone ? `<p class="notice">${freeInZone} seat(s) are still available in this zone. Choose one of the free seats on the map.</p>` : `<button class="btn" data-action="joinQueue" style="background:var(--accent)">Join zone waiting list</button>`}`;
  }
  if (seat.status === "free") {
    const expiredMine = state.lastExpiredReservation && state.lastExpiredReservation.seatId === seat.id && state.lastExpiredReservation.studentId === state.studentId;
    return `${state.lockError ? `<p class="panel-error">${state.lockError}</p>` : ""}<p class="panel-text">This seat is available for a 3-hour session.</p>${expiredMine ? `<p class="notice">Your previous session ended. Scan the QR at the seat to renew if nobody is waiting, or reserve it again.</p><button class="btn" style="background:var(--accent);margin-bottom:8px" data-action="openScanner">Scan seat QR to renew</button>` : ""}<button class="btn" style="background:var(--yours-border)" data-action="lockLibrary">Reserve seat · 3 hours</button>`;
  }
  if (seat.status === "incoming") {

      const rem = Math.max(0, Math.ceil((r.checkInDeadline-state.now)/1000));
      return `<p class="panel-text">Your seat is reserved. When you arrive at the desk, scan the physical QR code attached to that seat to start your 3-hour session.</p><div class="timer-row"><span class="timer-dot">⏱</span><span class="timer-value">${formatReal(rem)}</span><span class="panel-label">to check in</span></div><div class="btn-row"><button class="btn btn-flex" style="background:var(--yours-border)" data-action="openScanner">Scan seat QR</button><button class="btn-secondary" data-action="cancelHold">Cancel</button></div>`;
    }

      return `<p class="panel-text">This seat is being offered to you from the waiting list. Confirm within 5 minutes.</p><button class="btn" style="background:var(--yours-border)" data-action="acceptOffer">Accept seat offer</button>`;

  }
  if (seat.status === "yours" && mine && r.status === "active") {
    const rem = Math.max(0, Math.ceil((r.expiresAt-state.now)/1000));
    return `<p class="panel-text">You're checked in. Your seat is yours until the 3-hour timer ends.</p><div class="timer-row"><span class="timer-dot">⏱</span><span class="timer-value" id="panel-session-timer">${formatReal(rem)}</span><span class="panel-label">remaining</span></div><p class="panel-label">At expiry, scan the physical seat QR again to request renewal. Renewal is allowed only if nobody is waiting.</p><div class="btn-row"><button class="btn-secondary" data-action="exitDay">Release seat</button></div>`;
  }
  if (seat.status === "yours") return `<p class="panel-text">This seat is currently in use.</p>`;
  return "";
}

function ticketHTML() {
  const r = activeReservation();
  const queueEntries = state.waitingList.filter(q => q.studentId === state.studentId).sort((a,b)=>a.createdAt-b.createdAt);
  let ticket = `<div class="empty-ticket">No active booking yet. Select a free seat on the map to reserve it for 3 hours. Your booking ticket will show your seat and check-in deadline. Scan the physical QR at the desk when you arrive.</div>`;
  if (r) {
    const seat = seatById(r.seatId);
    const expires = r.status === "active" && r.expiresAt ? new Date(r.expiresAt).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}) : "Awaiting QR check-in";
    ticket = `<div class="ticket-layout"><div class="ticket-details"><div class="ticket-code">${r.bookingId}</div><div class="ticket-meta">Student: ${escapeHTML(state.studentName || r.studentId)}<br>Seat: ${seat?.label || r.seatId}<br>Floor: ${FLOORS.find(f=>f.id===r.floorId)?.name || r.floorId}<br>Status: <span class="status-pill ${r.status==='active'?'success':'warning'}">${r.status==='active'?'Checked in':'Reserved'}</span><br>${r.status==='active'?'Session ends: '+expires:'Check in by: '+new Date(r.checkInDeadline).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div></div></div><div class="ticket-actions"><button class="small-btn primary" data-action="openMySeat">View seat</button><button class="small-btn" data-action="printTicket">Print ticket</button><button class="small-btn" data-action="releaseTicket">Cancel / release</button></div>`;
  }
  const queueHTML = queueEntries.length ? `<div class="queue-list">${queueEntries.map(q=>{const seat=seatById(q.requestedSeatId); const zone=FLOORS.find(f=>f.id===q.floorId)?.zones.find(z=>z.id===q.zoneId); const pos=zoneQueue({floorId:q.floorId,zoneId:q.zoneId}).findIndex(x=>x.studentId===q.studentId)+1; return `<div class="queue-item"><div class="queue-number">#${pos}</div><div class="queue-main"><div class="queue-name">${zone?.name || q.zoneId}</div><div class="queue-sub">${seat?.label || 'Any seat'} · ${pos===1?'Next in line':'Waiting'}</div></div><span class="status-pill ${pos===1?'success':''}">${pos===1?'Next':'Waiting'}</span></div>`}).join("")}</div><div class="ticket-actions"><button class="small-btn" data-action="leaveQueue">Leave waiting list</button></div>` : `<div class="empty-ticket">You're not on a waiting list. If a zone is full, select an occupied seat and join its zone queue.</div>`;
  const queueCount = queueEntries.length;
  const queueToggle = `<button class="small-btn" data-action="toggleQueue" aria-expanded="${state.queuePanelOpen ? "true" : "false"}" aria-controls="my-queue-panel">${state.queuePanelOpen ? "Hide queue status" : `My Queue Status${queueCount ? ` (${queueCount})` : ""}`}</button>`;
  const queuePanel = state.queuePanelOpen ? `<section class="dash-card queue-status-card" id="my-queue-panel"><div class="queue-card-head"><div><h2 class="dash-title">My Queue Status</h2><p class="dash-copy">Only your own queue entries are shown here.</p></div><button class="panel-close" data-action="toggleQueue" aria-label="Hide queue status">✕</button></div>${queueHTML}</section>` : "";
  return `<div class="dashboard"><section class="dash-card"><div class="ticket-card-head"><h2 class="dash-title">My booking ticket</h2>${queueToggle}</div><div class="student-row">${state.editingStudentName ? `<label for="student-id">Your name</label><input class="student-input" id="student-id" value="${escapeHTML(state.studentName)}" maxlength="32" autocomplete="name" aria-label="Edit your name"><button class="small-btn primary" data-action="saveStudent">Save</button><button class="small-btn" data-action="cancelEditStudent">Cancel</button>` : `<span class="student-name-display"><span class="student-name-label">Student</span><strong>${escapeHTML(state.studentName)}</strong></span><button class="small-btn" data-action="editStudent">Edit name</button>`}</div>${state.notice ? `<div class="notice ${state.noticeType}">${state.notice}</div>` : ""}${ticket}</section>${queuePanel}</div>`;
}
let seatQrScanner = null;
function showScannerError(message) {
  state.scannerError = message;
  const modal = document.querySelector(".scanner-modal");
  if (!modal) return;
  let error = modal.querySelector(".scanner-error");
  if (!error) {
    error = document.createElement("p");
    error.className = "scanner-error";
    error.setAttribute("role", "alert");
    modal.querySelector(".scanner-actions")?.before(error);
  }
  error.textContent = message;
}
function scannerModalHTML() {
  if (!state.scannerOpen) return "";
  return `<div class="scanner-backdrop" role="presentation"><section class="scanner-modal" role="dialog" aria-modal="true" aria-labelledby="scanner-title"><div class="scanner-head"><h2 class="scanner-title" id="scanner-title">Scan seat QR</h2><button class="panel-close" data-action="closeScanner" aria-label="Close scanner">✕</button></div><p class="scanner-copy">Allow camera access when prompted, then point your camera at the QR label physically attached to your reserved seat.</p><div id="qr-reader"></div>${state.scannerError ? `<p class="scanner-error" role="alert">${escapeHTML(state.scannerError)}</p>` : ""}<div class="scanner-actions"><button class="btn-secondary" data-action="closeScanner">Cancel</button>${state.scannerFailed ? `<button class="btn" data-action="retryScanner">Try camera again</button>` : ""}</div></section></div>`;
}
function scannerModalMount() {
  if (!state.scannerOpen || seatQrScanner || state.scannerFailed || !document.getElementById("qr-reader")) return;
  if (!window.Html5Qrcode) {
    state.scannerError = "The scanner library could not load. Check your internet connection and try again.";
    state.scannerFailed = true;
    render();
    return;
  }
  seatQrScanner = new Html5Qrcode("qr-reader");
  seatQrScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 230, height: 230 }, aspectRatio: 1 }, async decodedText => {
    if (!state.scannerOpen) return;
    const expectedSeat = state.selectedId;
    let scannedSeat = decodedText.trim();
    try {
      const parsed = new URL(decodedText, window.location.href);
      scannedSeat = parsed.searchParams.get("checkin") || scannedSeat;
    } catch {}
    if (!seatById(scannedSeat)) {
      showScannerError("That QR code is not a recognized library seat label. Try scanning the QR attached to your seat.");
      return;
    }
    if (expectedSeat && scannedSeat !== expectedSeat) {
      showScannerError(`You selected ${seatById(expectedSeat)?.label || expectedSeat}, but scanned ${seatById(scannedSeat)?.label || scannedSeat}. Scan the QR for your selected seat.`);
      return;
    }
    await stopSeatScanner();
    state.scannerOpen = false;
    state.scannerError = "";
    state.scannerFailed = false;
    checkIn(scannedSeat, true);
  }, () => {}).catch(err => {
    seatQrScanner = null;
    state.scannerError = "Camera access is required to scan. Allow camera permission in your browser and make sure the site is opened over HTTPS. " + (err?.message || "");
    state.scannerFailed = true;
    render();
  });
}
async function stopSeatScanner() {
  if (!seatQrScanner) return;
  const scanner = seatQrScanner;
  seatQrScanner = null;
  try { await scanner.stop(); } catch {}
  try { scanner.clear(); } catch {}
}
async function closeSeatScanner() {
  state.scannerOpen = false;
  state.scannerError = "";
  state.scannerFailed = false;
  await stopSeatScanner();
  render();
}
function openSeatScanner() {
  state.scannerOpen = true;
  state.scannerError = "";
  state.scannerFailed = false;
  render();
  scannerModalMount();
}

function render() {
  state.now = Date.now();
  if (!state.studentName) {
    document.getElementById("app").innerHTML = `
      <main class="welcome-screen">
        <section class="welcome-card" aria-labelledby="welcome-title">
          <div class="welcome-mark" aria-hidden="true">⌂</div>
          <div class="welcome-eyebrow">Central Library</div>
          <h1 class="welcome-title" id="welcome-title">Welcome to your study space.</h1>
          <p class="welcome-copy">Enter your name to explore the library, choose a seat, and manage your booking.</p>
          <form id="welcome-form" novalidate>
            <label class="welcome-label" for="welcome-name">What should we call you?</label>
            <input class="welcome-input" id="welcome-name" name="name" type="text" maxlength="32" autocomplete="given-name" placeholder="Enter your name" required autofocus>
            ${state.welcomeError ? `<div class="welcome-error" role="alert">${state.welcomeError}</div>` : ""}
            <button class="welcome-submit" type="submit">Enter library <span aria-hidden="true">→</span></button>
          </form>
          <p class="welcome-footnote">Demo access · Your name is saved in this browser.</p>
        </section>
      </main>`;
    const welcomeInput = document.getElementById("welcome-name");
    if (welcomeInput) welcomeInput.focus();
    return;
  }
  resolveTimers();
  const floor = FLOORS.find(f => f.id === state.activeFloor);
  const floorSeats = state.seats.filter(s => s.floorId === state.activeFloor);
  const zonesHTML = floor.zones.map(zone => zoneHTML(zone, floorSeats.filter(s => s.zoneId === zone.id))).join("");
  document.getElementById("app").innerHTML = `
    <div class="main">
      <div class="main-header"><h1 class="main-title">${floor.name}</h1><span class="main-count">${freeCount(state.activeFloor)} / ${totalCount(state.activeFloor)} free</span></div>
      <p class="main-sub">${floor.sub} · Central Library · Seat Booking & QR Check-In</p>
      ${ticketHTML()}
      <div class="zones">${zonesHTML}</div>${legendHTML()}
    </div>${railHTML()}${panelHTML()}${scannerModalHTML()}`;
  if (state.scannerOpen) scannerModalMount();
  persistState();
}
// ---------- events ----------
document.addEventListener("submit", (e) => {
  if (e.target.id !== "welcome-form") return;
  e.preventDefault();
  const input = document.getElementById("welcome-name");
  const name = (input?.value || "").trim().replace(/\s+/g, " ");
  if (!name) { state.welcomeError = "Please enter your name to continue."; render(); return; }
  if (name.length > 32) { state.welcomeError = "Please use a name with 32 characters or fewer."; render(); return; }
  state.studentName = name;
  state.studentId = name.toUpperCase();
  state.welcomeError = "";
  persistState();
  render();
});
document.addEventListener("click", (e) => {
  const seatBtn = e.target.closest("[data-seat]");
  if (seatBtn) { openSeat(seatBtn.dataset.seat); return; }
  const floorBtn = e.target.closest("[data-floor]");
  if (floorBtn) { switchFloor(floorBtn.dataset.floor); return; }
  const actionEl = e.target.closest("[data-action]");
  if (!actionEl) return;
  const action = actionEl.dataset.action;
  const id = state.selectedId;
  if (action === "close") return closePanel();
  if (action === "lockLibrary") return lockFromLibrary(id);
  if (action === "confirmArrived") return checkIn(id, false);
  if (action === "openScanner") return openSeatScanner();
  if (action === "closeScanner") return closeSeatScanner();
  if (action === "retryScanner") { state.scannerFailed = false; state.scannerError = ""; render(); scannerModalMount(); return; }
  if (action === "cancelHold") return cancelHold(id);
  if (action === "exitDay") return exitForDay(id);
  if (action === "exitBreak") return exitForBreak(id);
  if (action === "imBack") return imBack(id);
  if (action === "joinQueue") return joinWaitingList(id);
  if (action === "leaveQueue") return leaveWaitingList();
  if (action === "toggleQueue") { state.queuePanelOpen = !state.queuePanelOpen; render(); return; }
  if (action === "editStudent") {
    state.editingStudentName = true;
    render();
    document.getElementById("student-id")?.focus();
    document.getElementById("student-id")?.select();
    return;
  }
  if (action === "cancelEditStudent") {
    state.editingStudentName = false;
    render();
    return;
  }
  if (action === "saveStudent") {
    const input = document.getElementById("student-id");
    if (input) {
      const name = input.value.trim().replace(/\\s+/g, " ");
      if (!name || name.length > 32) {
        input.setCustomValidity("Enter a name between 1 and 32 characters.");
        input.reportValidity();
        return;
      }
      state.editingStudentName = false;
      updateStudentId(name);
    }
    return;
  }
  if (action === "openMySeat") {
    const r = activeReservation(); if (r) { state.activeFloor = r.floorId; openSeat(r.seatId); }
    return;
  }
  if (action === "releaseTicket") {
    const r = activeReservation(); if (r) return r.status === "reserved" ? cancelHold(r.seatId) : exitForDay(r.seatId);
    return;
  }
  if (action === "printTicket") { window.print(); return; }
  if (action === "acceptOffer") {
    const offer = state.queueOffer; const s = offer && seatById(offer.seatId);
    if (!offer || !s || offer.studentId !== state.studentId || Date.now() > offer.expiresAt) { setNotice("This seat offer has expired or belongs to another student.", "error"); render(); return; }
    if (hasSeatAlready()) { setNotice("Release your existing booking before accepting the offer.", "error"); render(); return; }
    state.reservation = { bookingId: makeBookingId(), studentId: state.studentId, seatId: s.id, floorId: s.floorId, zoneId: s.zoneId, status: "reserved", reservedAt: Date.now(), checkInDeadline: Date.now()+15*60*1000, expiresAt: null };
    s.status = "incoming"; s.timer = {startedAt:Date.now(),demoDurationMs:15*60*1000,realDurationSec:15*60,purpose:"checkin"}; state.queueOffer = null;
    setNotice("Seat offer accepted. Scan the seat QR within 15 minutes to start your session.", "success"); persistState(); render(); return;
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && state.selectedId) closePanel();
});

document.addEventListener("input", (e) => {
  if (e.target.id === "student-id") {
    const cursor = e.target.selectionStart;
    const value = e.target.value;
    const normalized = value.trim().toUpperCase();
    if (normalized.length <= 32) state.studentIdDraft = normalized;
    if (cursor != null) e.target.setSelectionRange(cursor, cursor);
  }
});

function updateVisibleTimerText() {
  if (!state.selectedId) return;
  const el = document.getElementById("panel-session-timer");
  const r = activeReservation();
  if (el && r?.status === "active") el.textContent = formatReal(Math.max(0,(r.expiresAt-state.now)/1000));
  const panelTimer = document.querySelector(".panel .timer-value");
  if (panelTimer && r?.status === "reserved" && r.seatId === state.selectedId) panelTimer.textContent = formatReal(Math.max(0,(r.checkInDeadline-state.now)/1000));
}
setInterval(() => {
  state.now = Date.now();
  const changed = resolveTimers();
  if (changed) render(); else updateVisibleTimerText();
}, 1000);

render();
handleQrCheckin();
</script>
</body>
</html>
